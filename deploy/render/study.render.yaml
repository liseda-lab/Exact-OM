# Separate, unpublished study service; frontend and final launch are separate work.
services:
  - type: web
    name: exact-ranking-study
    runtime: docker
    dockerfilePath: ./deploy/render/exact_study.Dockerfile
    dockerContext: .
    plan: starter
    autoDeployTrigger: "off"
    healthCheckPath: /api/ready
    envVars:
      - key: EXACT_STUDY_DATABASE_URL
        fromDatabase:
          name: exact-ranking-study-db
          property: connectionString
      - key: EXACT_STUDY_SIGNING_SECRET
        generateValue: true
      - key: EXACT_STUDY_RESEARCHER_TOKEN
        generateValue: true
      - key: EXACT_STUDY_ORIGIN
        sync: false
      - key: EXACT_STUDY_ASSETS_DIR
        value: /app/study-assets

databases:
  - name: exact-ranking-study-db
    databaseName: exact_study
    user: exact_study
    plan: basic-256mb
    ipAllowList: []
