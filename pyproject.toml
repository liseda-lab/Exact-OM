[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Exact-OM"
version = "2.0.0"
description = "Explainable ontology matching with cached evidence and calibrated selection"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Pedro Cotovio", email = "pgcotovio@gmail.com"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.7,<3", "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "pyarrow>=17,<24", "scikit-learn>=1.6,<1.10", "joblib>=1.4,<2", "threadpoolctl>=3.5,<4",
  "sentence-transformers>=2.7,<3", "transformers>=4.41,<5", "accelerate>=0.34,<2",
  "huggingface-hub>=0.34,<1", "sentencepiece>=0.2,<1",
  "pydantic>=2.10,<3", "typing-extensions>=4.12,<5",
  "pyowl-core>=0.2.1,<0.3", "pyowl2vec-star-projector>=0.2.1,<0.3",
  "rdflib>=7.1,<8", "networkx>=3.2,<4",
  "PyYAML>=6,<7", "ruamel.yaml>=0.19,<0.20",
  "httpx>=0.28,<1", "requests>=2.31,<3", "tqdm>=4.66,<5",
  "zstandard>=0.23,<1", "matplotlib>=3.8,<4", "seaborn>=0.13,<0.14",
]

[project.optional-dependencies]
bioml-eval = ["oaei-bioml-eval>=0.2.1,<0.3"]
reasoning = ["pyelk-reasoner>=0.2.1,<0.3", "pyhermit>=0.2.1,<0.3"]
dev = ["pytest>=8,<9", "build>=1.2,<2", "twine>=6,<7", "ruff>=0.11,<1"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]

[project.urls]
Homepage = "https://github.com/liseda-lab/Exact-OM"
Documentation = "https://liseda-lab.github.io/Exact-OM/"
Issues = "https://github.com/liseda-lab/Exact-OM/issues"

[project.scripts]
exact = "exact.delivery.cli.main:main"
exact-eval = "exact.delivery.cli.eval:main"
bioml-eval = "exact.delivery.cli.eval:main"

[tool.setuptools.packages.find]
include = ["exact", "exact.*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
exact = ["default_config.yaml", "resources/**/*", "decisions/*.json", "tracks/builtin/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
  "requires_data: external or licensed ontology data",
  "slow: long integration or performance test",
  "requires_llm: real local or hosted language model",
  "requires_cuda: CUDA hardware",
  "requires_openrouter: live provider access",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.black]
line_length = 100
