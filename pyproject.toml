[tool.poetry]
name = "Exact-OM"
version = "2.0.0"
description = "Exact is a deep learning framework for explainable ontology matching."
authors = ["Pedro Cotovio <pgcotovio@gmail.com>"]
readme = "README.md"
repository = "https://github.com/liseda-lab/Exact-OM"
packages = [
    { include = "exact" },
    { include = "exact_inspect" },
    { include = "study_visualizer_runtime" },
]
include = [
    { path = "configs/profiles/*.yaml", format = ["sdist", "wheel"] },
    { path = "exact_inspect/static/**/*", format = ["wheel"] },
]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.7.0"
tensorboard = "^2.16.2"
dill = "^0.3.8"
lxml = "^5.2.1"
pandas = "^2.2.2"
sentence-transformers = "^2.7.0"
cython = "^3.0.11"
typing-extensions = "^4.12.2"
pydantic = "^2.10.6"
pyowl-core = ">=0.1,<0.2"
pyowl2vec-star-projector = ">=0.1,<0.2"
matplotlib = "^3.10.0"
seaborn = "^0.13.2"
pyaml = "^25.1.0"
ruamel-yaml = "^0.19.1"
peft = "^0.15.0"
sentencepiece = "^0.2.0"
rdflib = "^7.5.0"
httpx = "^0.28.1"
fastapi = {version = "^0.116.1", optional = true}
uvicorn = {version = "^0.35.0", extras = ["standard"], optional = true}
pydantic-settings = {version = "^2.12.0", optional = true}
zstandard = "^0.23.0"
oaei-bioml-eval = {version = ">=0.2,<0.3", extras = ["reasoner"], optional = true}
huggingface-hub = {version = "^0.36.2", optional = true}
mkdocs-material = {version = "^9.7.6", optional = true}
mkdocstrings = {version = "^1.0.4", extras = ["python"], optional = true}
mkdocs-gen-files = {version = "^0.6.1", optional = true}
mkdocs-literate-nav = {version = "^0.6.3", optional = true}
linkchecker = {version = "^10.6.0", optional = true}
pyelk-reasoner = {version = ">=0.1,<0.2", optional = true}
pyhermit = {version = ">=0.1,<0.2", optional = true}

[tool.poetry.extras]
bioml-eval = ["oaei-bioml-eval"]
hf = ["huggingface-hub"]
viz = ["fastapi", "uvicorn", "pydantic-settings"]
docs = ["mkdocs-material", "mkdocstrings", "mkdocs-gen-files", "mkdocs-literate-nav", "linkchecker"]
reasoning = ["pyelk-reasoner", "pyhermit"]


[tool.poetry.scripts]
exact = "exact.delivery.cli.main:main"
bioml-eval = "exact.delivery.cli.eval:main"
exact-eval = "exact.delivery.cli.eval:main"
exact-llm-debug = "exact.delivery.cli.llm_debug:main"
exact-user-study = "exact.delivery.cli.user_study:main"
exact-study-viz = "exact.delivery.cli.study_visualizer:main"
exact-inspect = "exact_inspect.cli:main"


[tool.poetry.group.prebuild.dependencies]
flake8 = "^7.0.0"
isort = "^5.13.2"
mypy = "^1.9.0"
pytest = "^8.1.1"
black = "^24.4.2"
import-linter = "^2.1"
pytest-cov = "^6.0"
interrogate = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# isort
[tool.isort]
profile = "black"
multi_line_output = 3
force_grid_wrap = 0

# black
[tool.black]
line_length = 100

# mypy
[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = ["exact", "exact_inspect", "study_visualizer_runtime"]
ignore_missing_imports = true
check_untyped_defs = false

# The first production-code baseline deliberately quarantines only the legacy
# modules that already contain incompatible annotations.  Everything else,
# including new modules, remains checked; follow-up work packages can shrink
# this list as they replace or split the affected code.
[[tool.mypy.overrides]]
module = [
    "exact.analysis.study_visualizer",
    "exact.analysis.user_study.*",
    "exact.core.actions.alignment",
    "exact.core.actions.evaluation",
    "exact.core.contracts.dataset",
    "exact.core.contracts.model",
    "exact.core.contracts.trainer",
    "exact.core.entities.mappings.reference",
    "exact.core.entities.ontology",
    "exact.core.entities.registry.registry",
    "exact.delivery.cli.llm_debug",
    "exact.impl.datasets.contextgraph",
    "exact.impl.datasets.pair_adaptive_context",
    "exact.impl.evaluator",
    "exact.impl.metrics.full",
    "exact.impl.metrics.local",
    "exact.impl.models.pair_adaptive_channels",
    "exact.impl.models.pair_adaptive_evidence",
    "exact.impl.models.pair_adaptive_scorer",
    "exact.impl.models.scorer_common",
    "exact.impl.models.semantic_scorer",
    "exact.impl.models.semantic_llm",
    "exact.impl.models.selector.*",
    "exact.impl.trainer.audit_io",
    "exact.impl.trainer.checkpointing",
    "exact.impl.trainer.overlays",
    "exact.impl.trainer.rationales",
    "exact.impl.trainer.runner",
    "exact.utils.candidate_generation",
    "exact.utils.data",
    "exact.utils.eval",
    "exact.utils.graph_search",
    "exact.llm.routing",
    "exact.utils.logs",
    "study_visualizer_runtime.app",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "requires_data: requires external or licensed ontology data",
    "slow: long-running integration or performance test",
    "requires_llm: requires a real local or hosted language model",
    "requires_cuda: requires an available CUDA device",
    "requires_openrouter: requires configured OpenRouter network access",
]

[tool.interrogate]
style = "google"
ignore-init-module = true
ignore-semiprivate = true
ignore-magic = true
ignore-property-decorators = true
ignore-nested-functions = true
fail-under = 80
