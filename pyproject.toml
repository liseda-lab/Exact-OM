[tool.poetry]
name = "Exact-OM"
version = "1.0.0"
description = "Exact is a deep learning framework for explainable ontology matching."
authors = ["Pedro Cotovio <pgcotovio@gmail.com>"]
readme = "README.md"
repository = "https://github.com/liseda-lab/Matcha-DL"
packages = [
    { include = "exact" },
]

exclude = ["matcha_dl/impl/matcha/matcha/**/*"]

[tool.poetry.dependencies]
python = "^3.10"
torch = {version = "2.7.0+cu128", source = "pytorch-gpu"}
tensorboard = "^2.16.2"
dill = "^0.3.8"
lxml = "^5.2.1"
pandas = "^2.2.2"
sentence-transformers = "^2.7.0"
cython = "^3.0.11"
typing-extensions = "^4.12.2"
pydantic = "^2.10.6"
mowl-borg = "^1.0.1"
matplotlib = "^3.10.0"
seaborn = "^0.13.2"
pyaml = "^25.1.0"
peft = "^0.15.0"
sentencepiece = "^0.2.0"
gensim = "^4.3.3"
rdflib = "^7.5.0"
httpx = "^0.28.1"


[tool.poetry.scripts]
exact = "exact.delivery.cli.align:main"
bioml-eval = "exact.delivery.cli.eval:main"
exact-llm-debug = "exact.delivery.cli.llm_debug:main"


[tool.poetry.group.prebuild.dependencies]
flake8 = "^7.0.0"
isort = "^5.13.2"
mypy = "^1.9.0"
pytest = "^8.1.1"
black = "^24.4.2"


[[tool.poetry.source]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# isort
[tool.isort]
profile = "black"
# black
[tool.black]
line_length = 100
extend_skip = [".md", ".json"]
multi_line_output=3
force_grid_wrap = 0

# mypy
[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = ["tests/**/*.py"]
