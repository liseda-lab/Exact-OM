[tool.poetry]
name = "matcha-dl"
version = "2.0.0"
description = "Matcha-DL is a tool for supervised ontology alignment. It takes as input two ontologies and a set of mappings between them, and learns a model that can predict mappings between the two ontologies."
authors = ["Pedro Cotovio <pgcotovio@gmail.com>"]
readme = "README.md"
repository = "https://github.com/liseda-lab/Matcha-DL"
packages = [
    { include = "matcha_dl" },
]

exclude = ["matcha_dl/impl/matcha/matcha/**/*"]

[tool.poetry.dependencies]
python = "^3.10"
torch = {version = "2.7.0+cu128", source = "pytorch-gpu"}
tensorboard = "^2.16.2"
dill = "^0.3.8"
lxml = "^5.2.1"
pandas = "^2.2.2"
sentence-transformers = "^2.7.0"
cython = "^3.0.11"
typing-extensions = "^4.12.2"
pydantic = "^2.10.6"
mowl-borg = "^1.0.1"
matplotlib = "^3.10.0"
seaborn = "^0.13.2"
pyaml = "^25.1.0"
peft = "^0.15.0"
sentencepiece = "^0.2.0"
gensim = "^4.3.3"


# dgl = { url = "https://data.dgl.ai/wheels/torch-2.4/cu124/dgl-2.4.0%2Bcu124-cp310-cp310-manylinux1_x86_64.whl" }


[tool.poetry.scripts]
matchadl = "matcha_dl.delivery.cli.single_align:main"
matchadl-eval = "matcha_dl.delivery.cli.eval:main"
matchadl-dir = "matcha_dl.delivery.cli.dir_align:main"
matchadl-tune = "matcha_dl.delivery.cli.tune_align:main"


[tool.poetry.group.prebuild.dependencies]
flake8 = "^7.0.0"
isort = "^5.13.2"
mypy = "^1.9.0"
pytest = "^8.1.1"
black = "^24.4.2"


[[tool.poetry.source]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# isort
[tool.isort]
profile = "black"
# black
[tool.black]
line_length = 100
extend_skip = [".md", ".json"]
multi_line_output=3
force_grid_wrap = 0

# mypy
[tool.mypy]
warn_return_any = true
warn_unused_configs = true
files = ["tests/**/*.py"]