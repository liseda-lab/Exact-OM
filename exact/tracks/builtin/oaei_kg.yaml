descriptor_version: 1
name: oaei_kg
provider: http
provider_version: "1"
description: OAEI Knowledge Graph v4 tasks with class, property, and instance references.
upstream:
  revision: v4
  urls:
    - {url: "https://oaei.webdatacommons.org/tdrs/testdata/persistent/knowledgegraph/v4/suite/starwars-swg/component/source.xml", filename: starwars-swg/source.xml, tasks: [starwars-swg]}
    - {url: "https://oaei.webdatacommons.org/tdrs/testdata/persistent/knowledgegraph/v4/suite/starwars-swg/component/target.xml", filename: starwars-swg/target.xml, tasks: [starwars-swg]}
    - {url: "https://oaei.webdatacommons.org/tdrs/testdata/persistent/knowledgegraph/v4/suite/starwars-swg/component/reference.xml", filename: starwars-swg/reference.xml, tasks: [starwars-swg]}
    - {url: "https://oaei.webdatacommons.org/tdrs/testdata/persistent/knowledgegraph/v4/suite/starwars-swtor/component/source.xml", filename: starwars-swtor/source.xml, tasks: [starwars-swtor]}
    - {url: "https://oaei.webdatacommons.org/tdrs/testdata/persistent/knowledgegraph/v4/suite/starwars-swtor/component/target.xml", filename: starwars-swtor/target.xml, tasks: [starwars-swtor]}
    - {url: "https://oaei.webdatacommons.org/tdrs/testdata/persistent/knowledgegraph/v4/suite/starwars-swtor/component/reference.xml", filename: starwars-swtor/reference.xml, tasks: [starwars-swtor]}
    - {url: "https://oaei.webdatacommons.org/tdrs/testdata/persistent/knowledgegraph/v4/suite/marvelcinematicuniverse-marvel/component/source.xml", filename: marvelcinematicuniverse-marvel/source.xml, tasks: [marvelcinematicuniverse-marvel]}
    - {url: "https://oaei.webdatacommons.org/tdrs/testdata/persistent/knowledgegraph/v4/suite/marvelcinematicuniverse-marvel/component/target.xml", filename: marvelcinematicuniverse-marvel/target.xml, tasks: [marvelcinematicuniverse-marvel]}
    - {url: "https://oaei.webdatacommons.org/tdrs/testdata/persistent/knowledgegraph/v4/suite/marvelcinematicuniverse-marvel/component/reference.xml", filename: marvelcinematicuniverse-marvel/reference.xml, tasks: [marvelcinematicuniverse-marvel]}
    - {url: "https://oaei.webdatacommons.org/tdrs/testdata/persistent/knowledgegraph/v4/suite/memoryalpha-memorybeta/component/source.xml", filename: memoryalpha-memorybeta/source.xml, tasks: [memoryalpha-memorybeta]}
