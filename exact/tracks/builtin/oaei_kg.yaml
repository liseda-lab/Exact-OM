    - {url: "https://oaei.webdatacommons.org/tdrs/testdata/persistent/knowledgegraph/v4/suite/memoryalpha-stexpanded/component/source.xml", filename: memoryalpha-stexpanded/source.xml, tasks: [memoryalpha-stexpanded]}
    - {url: "https://oaei.webdatacommons.org/tdrs/testdata/persistent/knowledgegraph/v4/suite/memoryalpha-stexpanded/component/target.xml", filename: memoryalpha-stexpanded/target.xml, tasks: [memoryalpha-stexpanded]}
    - {url: "https://oaei.webdatacommons.org/tdrs/testdata/persistent/knowledgegraph/v4/suite/memoryalpha-stexpanded/component/reference.xml", filename: memoryalpha-stexpanded/reference.xml, tasks: [memoryalpha-stexpanded]}
tasks:
  starwars-swg:
    source: starwars-swg/source.xml
    target: starwars-swg/target.xml
    refs: {test: {path: starwars-swg/reference.xml, transform: alignment_rdf_to_tsv}}
    extras: &kg_kinds {entity_kinds: [class, property, instance]}
  starwars-swtor:
    source: starwars-swtor/source.xml
    target: starwars-swtor/target.xml
    refs: {test: {path: starwars-swtor/reference.xml, transform: alignment_rdf_to_tsv}}
    extras: *kg_kinds
  marvelcinematicuniverse-marvel:
    source: marvelcinematicuniverse-marvel/source.xml
    target: marvelcinematicuniverse-marvel/target.xml
    refs: {test: {path: marvelcinematicuniverse-marvel/reference.xml, transform: alignment_rdf_to_tsv}}
    extras: *kg_kinds
  memoryalpha-memorybeta:
    source: memoryalpha-memorybeta/source.xml
    target: memoryalpha-memorybeta/target.xml
    refs: {test: {path: memoryalpha-memorybeta/reference.xml, transform: alignment_rdf_to_tsv}}
    extras: *kg_kinds
  memoryalpha-stexpanded:
    source: memoryalpha-stexpanded/source.xml
    target: memoryalpha-stexpanded/target.xml
    refs: {test: {path: memoryalpha-stexpanded/reference.xml, transform: alignment_rdf_to_tsv}}
    extras: *kg_kinds
