
# System Parameters

## Verbosity level of the logs.
logging_level: INFO # DEBUG, INFO, WARNING, ERROR

# Seed for reproducibility.
seed: 42

## Used cached files to skip computations if available.
use_file_cache: True

# Evaluation Parameters

## Number of top-k predictions to be considered for evaluation.
k: [1, 5, 10]

# Alignment Parameters

alignment_params:
  ### ONLY USED FOR GLOBAL ALIGNMENT TASKS ###

  ## Threshold to be used to filter predictions.
  ## If Null, final alignment will not be filtered by score.
  threshold: 0.7 # 0.7

  ## Cardinality to be used to filter predictions.
  ## If Null, final alignment will not be filtered by cardinality.
  ## Only used in full alignment tasks.
  cardinality: 1 # null, 3

  # Saves
  save_json: True # If True, explanations JSON file should be saved.
  save_csv: True # If True, explanations CSV file should be saved.
  save_stats_csv: True # If True, detailed stats per example will be saved to a CSV file.
  append_stats_to_summary_csv: True # If True, human readable stats will be appended to the summary CSV file.

  # Explanations
  review_low: 0.5 # Lower bound score to flag a mapping for review.
  review_high: 0.8 # Upper bound score to flag a mapping for review.

dataset_params:

  # General Dataset Configs
  num_workers: null # Number of workers to be used to load the data. If null, the all available cores will be used.
  filter_exact_matches: True # If True, exact matches between source and target will be filtered out before training/inference.
  
  # Context Main Params
  n_hops: 1
  context_method: greedy # Method to generate context graph. Options: 'bfs' (breadth-first search), 'greedy'
  best_path_method: dp # Search method to find best path from source to target. Options: 'dp' (dynamic programming), 'greedy', 'lagrangian'
  context_hop_penalty: 0.1 # Penalty to be applied to each hop in the context graph.
  context_token_ratio: 1.3 # Ratio of context tokens to the model's max input length.
  context_safety: 0.8 # Safety margin to avoid exceeding the model's max input length when generating context.
  max_input_tokens_context: 256 # Maximum number of input tokens for the context (Budget).
  only_taxonomy: False # If True, only the taxonomy will be used to generate the context
  all_labels: True # If True, all labels will be provided as candidates for consideration in the alignment task.

  # Verbaliser Params
  verbaliser_name: Qwen/Qwen2.5-3B-Instruct
  gen_max_new_tokens: 64 # Max number of new tokens to be generated by the model for the context.
  do_sample: False # If True sampling will be used to generate the context.
  temperature: 0.1 # Temperature to be used in sampling. If >1, the model will be more creative.
  top_k: null # Top-k to be used in sampling. If >0, the model will only sample from the top-k most probable tokens.
  top_p: 0.9 # Top-p to be used in sampling. If >0, the model will only sample from the top-p most probable tokens.
  max_verb_gen_retries: 1 # Maximum number of retries for template generation in case of failure.
  # Efficiency Params
  exclude_missing_dr: False
  batch_size_verbaliser: 4 # Batch size to be used for verbaliser model inference.
  # Formatting Params
  delimiter: "\n" # Delimiter to be used when concatenating multiple context triples.
  # PLotting
  which: ["src_ctx_n_triples","tgt_ctx_n_triples","src_ctx_tok_len","tgt_ctx_tok_len","src_ctx_word_len","tgt_ctx_word_len","src_ctx_char_len","tgt_ctx_char_len",
          "src_lab_n_labels","tgt_lab_n_labels","src_lab_word_len","tgt_lab_word_len","src_lab_char_len","tgt_lab_char_len","src_lab_max_label_words","tgt_lab_max_label_words",
          "src_lab_avg_label_words","tgt_lab_avg_label_words",
          "cand_sim"] # Features to be plotted for analysis.

candidates_params:
  lexical_encoder_name: sentence-transformers/all-MiniLM-L6-v2
  encode_batch_size: 512 
  search_batch_size: 4096
  top_k: 50
  use_amp: True

sanity_check_params:
  sanity_check: True
  n: 3
  max_ctx_show: 3
  max_label_show: 3

plot_params:
  bins: 30
  figsize: [7, 5]
  dpi: 300
  kde: False
  alpha: 0.6

inference_params:
  batch_size: 64 # 
  num_workers: 5
  log_every: 10
  mixed_precision: True
  which: ["S_final", "I_label", "I_ctx", "I_llm", "w_c", "w_i"]
  
model:
  name: SemanticScorer
  params:
    # Models
    lexical_model_name: cambridgeltl/SapBERT-from-PubMedBERT-fulltext
    context_model_name: BAAI/bge-large-en-v1.5
    cross_encoder_name: BAAI/bge-reranker-large
    llm_model_name: Qwen/Qwen2.5-7B-Instruct
    # Precision
    fp16: True
    # Pooling Method
    pooling_method: mean
    # Max Tokens
    max_input_tokens_lexical: 32
    max_input_tokens_context: 256
    max_input_tokens_ce: 64
    max_total_tokens_llm_summary: 512
    max_total_tokens_llm_decision: 384
    max_new_tokens_llm: 64
    # Ablations / toggles
    use_lexical: True
    use_context: True
    use_cross_encoder: True
    use_llm: True
    # Cross-Encoder Params
    tau: 0.5 # Mid point to determine signal strength
    tau_ce: 0.9 # threshold for cross-encoder activation
    eta: 1.0 # Scaling factor for cross-encoder score
    # Adaptive context weighting
    gamma: 1.0 # Scaling factor for context/label adaptive weighting
    # LLM gating
    beta: 0.8 # Limit for LLM gating
    tau_LLM: 0.8 # Threshold for LLM activation
    # LLM generation knobs
    llm_temperature: 0.1
    llm_top_p: 0.9
    llm_do_sample: False
    llm_summary_batch_size: 8
    llm_decision_batch_size: 8
    profile_llm: False
    # Explanations
    return_explanations: True
