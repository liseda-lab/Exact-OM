# GENERATED — edit the pydantic models, then run `exact config default`.
# Configuration schema version; currently exactly 2.
config_version: 2
# Run-wide process settings.
run:
  # Global random seed used by deterministic components.
  seed: 42
  # Logging verbosity: DEBUG, INFO, WARNING, ERROR, or CRITICAL.
  logging_level: INFO
  # Reuse compatible dataset and model caches when available.
  use_file_cache: true
# Input and dataset-track selection.
data:
  # Registered dataset-track provider name.
  track:
  # Task identifier within the selected track.
  task:
  # Local track materialization root.
  root: data
  # Optional immutable track revision.
  revision:
  # Optional local track descriptor overriding registry discovery.
  descriptor:
  # Explicit source knowledge-source path.
  source:
  # Explicit target knowledge-source path.
  target:
  # Named reference alignments, such as train, test, and full.
  refs: {}
  # Optional candidate alignment path.
  candidates:
# Input adapters and output formats.
io:
  # Input adapter name, or auto to infer it from each input path.
  input_format: auto
  # Source-adapter-specific options.
  source_options: {}
  # Target-adapter-specific options.
  target_options: {}
  # Ordered alignment writer formats produced for each run.
  output_formats:
    - tsv-global
    - tsv-local
# Alignment extraction and scoring controls.
matching:
  # Minimum final score retained in the global alignment.
  threshold: 0.7
  # Maximum targets retained per source; null disables the limit.
  cardinality: 1
  # Maximum sources retained per target; null disables the limit.
  target_cardinality: 1
  # Lower review-band score bound.
  review_low: 0.5
  # Upper review-band score bound.
  review_high: 0.8
  # Knowledge-graph entity kinds eligible for alignment.
  entity_kinds:
    - class
  # Relation typing mode: none or hierarchy_heuristic.
  relation_prediction: none
  # Pair-adaptive channel constants exposed for reproducible sweeps.
  channels:
    # Embedding contribution to each hierarchy-channel score.
    hierarchy_embedding_weight: 0.5
    # Cross-side support contribution to each hierarchy-channel score.
    hierarchy_support_weight: 0.5
    # Embedding contribution to relational-similarity scoring.
    similarity_embedding_weight: 0.5
    # Cross-side support contribution to relational-similarity scoring.
    similarity_support_weight: 0.5
    # Maximum selected similarity triples per relation and side.
    similarity_per_relation_cap: 2
    # Maximum selected difference triples per relation and side.
    difference_per_relation_cap: 3
    # Multiplier applied to support standard deviation in channel quality.
    stability_factor: 2.0
    # Fallback weights for definition, identifier, comment, and other attributes.
    attribute_property_weights:
      definition: 1.0
      identifier: 0.8
      comment: 0.6
      other: 0.5
    # Word-count ceiling used to normalize attribute informativeness.
    attribute_information_word_cap: 20
    # Minimum support-only attribute-channel score.
    attribute_score_floor: 0.5
    # Scale of distance-to-neutral indecision uncertainty.
    uncertainty_indecision_scale: 2.0
    # Power applied to lexical/structural quality in disagreement uncertainty.
    uncertainty_disagreement_quality_power: 0.5
# Dataset construction and evidence extraction.
dataset:
  # Registered hierarchy reasoner name.
  reasoner: asserted
  # Dataset loading worker count.
  num_workers:
  # Remove exact lexical matches before semantic scoring.
  filter_exact_matches: true
  # Remove every candidate for sources with an exact match.
  drop_exact_match_sources: false
  # Exclude knowledge-source entities marked use_in_alignment=false.
  filter_ignored_alignment_classes: true
  # Include projected literal edges as attribute/support evidence.
  projection_include_literals: true
  # Maximum hierarchy depth collected for each configured family.
  hierarchy_max_depth: 2
  # Maximum hierarchy triples per family and entity.
  max_hierarchy_triples_per_family: 6
  # Maximum non-hierarchical object triples per entity.
  max_object_triples: 48
  # Maximum distinctive triples retained before pair reranking.
  max_diff_triples: 24
  # Maximum literal or annotation snippets per entity.
  max_attr_items: 12
  # Feature-build debug progress interval in unique entities.
  pair_adaptive_feature_log_every: 1000
  # Ontology-native hierarchical relation families and aliases.
  hierarchical_relation_families:
    is_a:
      iri_aliases:
        - http://www.w3.org/2000/01/rdf-schema#subClassOf
      label_seeds:
        - subclass of
        - is a
        - type of
        - kind of
    part_of:
      iri_aliases:
        - http://purl.obolibrary.org/obo/BFO_0000050
      label_seeds:
        - part of
        - component of
    has_part:
      iri_aliases:
        - http://purl.obolibrary.org/obo/BFO_0000051
      label_seeds:
        - has part
  # Projected neighborhood radius for structural evidence.
  n_hops: 1
  # Shared upper bound for joined context text.
  max_input_tokens_context: 256
  # Score all label variants instead of only a primary label.
  all_labels: true
  # Delimiter used to join verbalized triples.
  delimiter: "\n"
  # Dataset feature names included in preprocessing plots.
  which:
    - src_hier_total_count
    - tgt_hier_total_count
    - src_hier_is_a_count
    - tgt_hier_is_a_count
    - src_hier_part_of_count
    - tgt_hier_part_of_count
    - src_hier_has_part_count
    - tgt_hier_has_part_count
    - src_obj_count
    - tgt_obj_count
    - src_obj_relation_count
    - tgt_obj_relation_count
    - src_obj_ic_mean
    - tgt_obj_ic_mean
    - src_attr_count
    - tgt_attr_count
    - src_attr_weight_mean
    - tgt_attr_weight_mean
    - src_lab_n_labels
    - tgt_lab_n_labels
    - src_lab_word_len
    - tgt_lab_word_len
    - src_lab_avg_label_words
    - tgt_lab_avg_label_words
    - cand_sim
    - cand_sim_src_mean
  # Top lexical candidates shared by candidate utilities.
  candidate_share_k: 2
  # Controls retained only for the legacy single-context dataset.
  legacy:
    # Legacy single-context extraction strategy.
    context_method: greedy
    # Legacy context path-search strategy.
    best_path_method: dp
    # Legacy context-path hop penalty.
    context_hop_penalty: 0.1
    # Legacy approximate tokens-per-word budgeting ratio.
    context_token_ratio: 1.3
    # Legacy safety factor for context token budgets.
    context_safety: 0.8
    # Restrict legacy context extraction to taxonomy edges.
    only_taxonomy: false
    # Add explanation-only bridges to legacy extracted contexts.
    add_connectivity_bridges: true
    # Optional hard cap on legacy bridge path length.
    bridge_max_hops:
# Candidate retrieval controls.
candidates:
  # Candidate retrieval strategy: primary_label or hybrid.
  retrieval_strategy: hybrid
  # Sentence encoder used for semantic candidate retrieval.
  lexical_encoder_name: sentence-transformers/all-MiniLM-L6-v2
  # Candidate-encoder batch size.
  encode_batch_size: 512
  # Cosine-search batch size.
  search_batch_size: 4096
  # Candidates retained per source entity.
  top_k: 20
  # Use automatic mixed precision for candidate retrieval when supported.
  use_amp: true
  # Lexical and retrieval-channel fusion constants.
  fusion:
    # Weight of lexical token cosine in max fusion.
    token_weight: 1.0
    # Weight of character-gram cosine in max fusion.
    gram_weight: 0.85
    # Token contribution to the blended lexical retrieval score.
    blend_token_weight: 0.65
    # Character-gram contribution to the blended retrieval score.
    blend_gram_weight: 0.35
    # Weight applied to semantic retrieval before channel max fusion.
    semantic_channel_weight: 1.0
    # Weight applied to lexical retrieval before channel max fusion.
    lexical_channel_weight: 1.0
    # Minimum document-frequency ceiling for lexical features.
    df_ceiling_floor: 10
    # Target-corpus ratio used for the feature DF ceiling.
    df_ceiling_ratio: 0.2
  # Annotation-alias selection caps, priorities, and blocklists.
  aliases:
    # Maximum annotation aliases retained per entity.
    overall_cap: 12
    # Maximum normalized tokens in an alias literal.
    max_tokens: 12
    # Per-property cap for exact synonyms.
    exact_property_cap: 8
    # Per-property cap for preferred terms.
    preferred_property_cap: 2
    # Per-property cap for related synonyms.
    related_property_cap: 4
    # Fallback per-property alias cap.
    default_property_cap: 4
    # Property-name tokens accepted as alias signals.
    accepted_property_terms:
      - alt
      - label
      - name
      - pref
      - synonym
      - term
      - title
    # Property-name tokens excluded from candidate aliases.
    rejected_property_terms:
      - alternativeid
      - comment
      - created
      - creator
      - curator
      - date
      - definition
      - deprecated
      - description
      - editor
      - format
      - id
      - identifier
      - namespace
      - note
      - provenance
      - review
      - reviewer
      - semantic
      - slim
      - source
      - status
      - subset
      - type
      - version
      - xref
    # Compact property identifiers excluded from candidate aliases.
    rejected_properties:
      - nhc0
      - p97
      - p106
      - p207
      - p322
      - p325
      - p363
      - iao0000115
      - iao0000231
    # Compact identifiers or names treated as exact-synonym properties.
    exact_properties:
      - p90
      - has exact synonym
    # Compact identifiers treated as preferred-term properties.
    preferred_properties:
      - p107
      - p108
    # Property names treated as related-synonym sources.
    related_properties:
      - has related synonym
      - has narrow synonym
      - has broad synonym
    # Sort priority for exact aliases.
    exact_priority: 0.0
    # Sort priority for preferred aliases.
    preferred_priority: 0.05
    # Sort priority for related aliases.
    related_priority: 0.15
    # Sort priority for other accepted aliases.
    default_priority: 0.3
    # Preferred alias token count for the priority length penalty.
    priority_length_target: 3
    # Token-count cap used by the alias priority length penalty.
    priority_length_cap: 6
    # Divisor used by the alias priority length penalty.
    priority_length_divisor: 30.0
