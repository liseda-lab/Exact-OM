# Inference, audit, and checkpoint controls.
inference:
  # Candidate-pair inference batch size.
  batch_size: 512
  # Inference DataLoader worker count.
  num_workers: 0
  # Inference progress interval in batches.
  log_every: 10
  # Use torch autocast during supported GPU inference.
  mixed_precision: true
  # Model output fields included in inference plots.
  which:
    - S_final
    - S_base
    - S_struct
    - s_label
    - s_hier
    - s_sim
    - s_diff
    - s_attr
    - I_label
    - I_struct
    - I_hier
    - I_sim
    - I_diff
    - I_attr
    - I_llm
    - w_c
    - w_i
    - U
    - U_ind
    - U_dis
    - p_llm
  # Checkpoint interval in inference batches.
  checkpoint_every: 10
  # Resume from the latest compatible inference checkpoint.
  resume_from_checkpoint: true
  # Enable inference checkpoint creation.
  enable_checkpoints: true
  # Reuse compatible selector or reranker checkpoints.
  resume_additional_model_checkpoints: true
  # Allow resume when only rationale generation changed.
  allow_rationale_toggle_checkpoint_resume: true
  # Write incremental candidate-level audit shards.
  audit_shards_enabled: true
  # Audit shard compression: zstd or none.
  audit_shard_compression: zstd
  # Maximum records per audit shard before rotation.
  audit_shard_records: 50000
  # Checkpoint payload mode: compact or full.
