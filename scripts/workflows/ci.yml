name: Production checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      EXACT_OPENROUTER_REQUEST_CAP: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev,docs,reasoning,viz]'
      - run: ruff check exact exact_inspect scripts
      - run: pytest -q --basetemp /tmp/exact-tests -m 'not requires_data and not slow and not requires_llm and not requires_cuda and not requires_openrouter'
      - run: mkdocs build --strict
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: python scripts/build_frontend.py
      - run: npm --prefix explanations_visualizer run test:unit
      - name: Install browser for local app checks
        if: matrix.python == '3.12'
        working-directory: explanations_visualizer
        run: npx playwright install --with-deps chromium
      - name: Local app browser checks
        if: matrix.python == '3.12'
        working-directory: explanations_visualizer
        run: |
          npm run test:e2e
          for mode in global_full local_ranking; do
            staged_archive=$(python -c 'import json, pathlib, sys; paths=list(pathlib.Path("/tmp/exact-tests").rglob("staged_pipeline_paths.json")); assert len(paths)==1; print(json.loads(paths[0].read_text())["archives"][sys.argv[1]])' "$mode")
            EXACT_UI_STAGED_ARCHIVE="$staged_archive" npm run test:e2e
          done
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py dist
      - name: Installed wheel commands outside checkout
        shell: bash
        run: |
          python -m venv --system-site-packages /tmp/exact-wheel
          /tmp/exact-wheel/bin/pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          /tmp/exact-wheel/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
          if [ "${{ matrix.python }}" != "3.10" ]; then
          /tmp/exact-wheel/bin/python "$GITHUB_WORKSPACE/scripts/smoke_inspect_installed.py"
          fi
      - name: Installed source distribution
        shell: bash
        run: |
          python -m venv --system-site-packages /tmp/exact-sdist
          /tmp/exact-sdist/bin/pip install --no-deps --force-reinstall dist/*.tar.gz
          cd /tmp
          /tmp/exact-sdist/bin/python "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
          if [ "${{ matrix.python }}" != "3.10" ]; then
          /tmp/exact-sdist/bin/python "$GITHUB_WORKSPACE/scripts/smoke_inspect_installed.py"
          fi
