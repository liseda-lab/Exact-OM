services:
  - type: web
    name: study-viz-omim-ordo
    env: docker
    branch: app-dev
    dockerfilePath: ./deploy/render/study_visualizer.Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: EXACT_STUDY_RUN_DIR
        value: /app/deploy/render/study_bundles/omim-ordo
      - key: EXACT_STUDY_ANALYSIS_DIR
        value: /app/deploy/render/study_bundles/omim-ordo/analysis/user_study
      - key: EXACT_STUDY_ENABLE_ONTOLOGY_INFO
        value: "true"
      - key: EXACT_STUDY_LOG_LEVEL
        value: INFO
