  independent_unit: source_entity
  power_status: descriptive
  assumptions: ["This is a same-path reproducibility control, not a result-changing arm.", "Reporting seeds are paired across identical tasks and pools."]
  power_slices:
    - {id: bioml-ncit-doid-class-equivalence, task: bioml-ncit-doid-test, entity_kind: class, relation: equivalence, status: descriptive, hypothesized_effect: 0.0, assumptions: ["Same-path replay expects zero semantic effect."]}
    - {id: bioml-snomed-fma-class-equivalence, task: bioml-snomed-fma-test, entity_kind: class, relation: equivalence, status: descriptive, hypothesized_effect: 0.0, assumptions: ["Same-path replay expects zero semantic effect."]}
    - {id: bioml-snomed-ncit-class-equivalence, task: bioml-snomed-ncit-test, entity_kind: class, relation: equivalence, status: descriptive, hypothesized_effect: 0.0, assumptions: ["Same-path replay expects zero semantic effect."]}
