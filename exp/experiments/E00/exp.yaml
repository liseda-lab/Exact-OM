schema_version: 1
experiment_id: E00
title: Lean paper runner and frozen production baseline
implementation: {status: deferred, reason: "The authoritative E00 spec names Exact-OM 0.2.1 while the runtime and frozen baseline use 2.1.0, and baseline replay does not yet assert exact decision equality."}
base_config: ../../../exact/default_config.yaml
baseline_id: R_n
depends_on: []
resource: {kind: gpu, device: "0", concurrency: 1}
screen:
  tasks:
    - id: bioml-ncit-doid-valid
      split_role: development
      track: bioml_hf
      task: ncit-doid
      reference_role: valid
      overlay: {data: {candidate_source: reference_split}, evaluation: {dual_global_local: true}}
      reference_completeness: complete
      capabilities: [train_reference]
  seeds: [17]
  source_cap: 300
confirm:
  tasks:
    - {id: bioml-ncit-doid-test, split_role: reporting, track: bioml_hf, task: ncit-doid, reference_role: test, overlay: {data: {candidate_source: reference_split}, evaluation: {dual_global_local: true}}, reference_completeness: complete, capabilities: [train_reference]}
    - {id: bioml-snomed-fma-test, split_role: reporting, track: bioml_hf, task: snomed-fma, reference_role: test, overlay: {data: {candidate_source: reference_split}, evaluation: {dual_global_local: true}}, reference_completeness: complete, capabilities: [train_reference]}
    - {id: bioml-snomed-ncit-test, split_role: reporting, track: bioml_hf, task: snomed-ncit, reference_role: test, overlay: {data: {candidate_source: reference_split}, evaluation: {dual_global_local: true}}, reference_completeness: complete, capabilities: [train_reference]}
  seeds: [17, 29, 43]
arms:
  - {id: R_n, role: baseline, overlay: {}}
  - {id: baseline_replay, role: candidate, overlay: {}}
selection:
  decisions:
    - {id: reproduce_frozen_default, baseline: R_n, candidates: [baseline_replay], metric: F1, direction: max, min_delta: 0.0, required_controls: [], allow_screened_out: false}
design:
  primary_comparison: baseline_replay_vs_R_n
  primary_endpoint: macro_F1
  independent_unit: source_entity
  power_status: descriptive
  assumptions: ["This is a same-path reproducibility control, not a result-changing arm.", "Reporting seeds are paired across identical tasks and pools."]
  required_slices: [task, entity_kind, relation]
  regression_bound: 0.0
  cost_bound: 1.2
  multiplicity: none
  reporting_exclusions: [development_selection]
negative_label_policy: not_applicable
