      metric: F1
      min_delta: 0.0
      tie_tolerance: 0.002
      guards:
        - {id: per_task_f1_regression, metric: F1, direction: max, scope: each_task, min_delta: -0.005}
        - {id: exact_explanation_reconstruction, metric: explanation_reconstruction.max_abs_error, comparison: absolute_threshold, direction: min, scope: each_cell, threshold: 0.000001}
        - {id: runtime_bound, metric: wall_seconds, direction: min, min_relative_delta: -0.20}
      tie_breaks:
        - {kind: metric, metric: local.MRR, direction: max}
        - {kind: metric, metric: llm.total_tokens, direction: min}
        - {kind: metric, metric: wall_seconds, direction: min}
        - {kind: numeric_overlay_l1, direction: min, paths: [matching.fusion.gamma, matching.fusion.llm_pivot, matching.fusion.beta]}
    - id: accept_training
      baseline: shipped_logistic_winner
      candidates: [logistic_runnerup]
      metric: F1
      min_delta: 0.0
      guards:
        - {id: per_task_f1_regression, metric: F1, direction: max, scope: each_task, min_delta: -0.005}
        - {id: exact_explanation_reconstruction, metric: explanation_reconstruction.max_abs_error, comparison: absolute_threshold, direction: min, scope: each_cell, threshold: 0.000001}
        - {id: runtime_bound, metric: wall_seconds, direction: min, min_relative_delta: -0.20}
      required_controls: [gbdt_winner, gbdt_runnerup]
design:
  primary_comparison: independent_fusion_and_accept_decisions
  primary_endpoint: macro_F1
  independent_unit: source_entity
  power_status: underpowered
  assumptions: ["Neutral fusion tau stays fixed at 0.5; E10 sweeps gamma={0.5,0.73,1,2,3}, the canonical scorer LLM pivot llm_pivot={0.35,0.5,0.6}, and beta={0.6,0.8,1.0}.", "First reject arms that fail explanation reconstruction, runtime/cost bounds, or a per-task regression guard; rank the rest by macro F1, local MRR, fewer LLM tokens, runtime, then distance from shipped constants, treating macro-F1 differences below 0.002 as ties.", "Phase A retains the top three fusion cells; phase B dynamically crosses those cells with logistic/GBDT and winner-only/winner-plus-runner-up acceptance, then freezes independent fusion and accept decisions plus their conditional 2x2.", "GBDT remains non-deployable until the owner explicitly accepts the interpretability trade-off."]
  required_slices: [task, entity_kind, llm_invocation]
  regression_bound: 0.005
  cost_bound: 1.2
  multiplicity: holm
negative_label_policy: complete_reference_or_confirmed_negative
