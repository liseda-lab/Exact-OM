schema_version: 1
experiment_id: E22
title: Label efficiency and automatic supervision resolution
implementation: {status: deferred, reason_code: label_budget_orchestration_unavailable, reason: "The supervision modes are declared, but grouped budget subsampling, component-specific effective-unit accounting, active selection, nested crossover fitting, and immutable fitted-auto policy artifacts are not implemented."}
base_config: ../../../exact/default_config.yaml
baseline_id: R_0
depends_on: [E15, E18, E19, E20, E21, E23]
resource: {kind: gpu, device: "0", concurrency: 1}
screen:
  tasks:
    - {id: bioml-ncit-doid-valid, split_role: development, track: bioml_hf, task: ncit-doid, reference_role: valid, overlay: {data: {candidate_source: reference_split}}, reference_completeness: complete, capabilities: [train_reference]}
  seeds: [17, 29, 43]
  source_cap: 300
confirm:
  tasks:
    - {id: bioml-ncit-doid-test, split_role: reporting, track: bioml_hf, task: ncit-doid, reference_role: test, overlay: {data: {candidate_source: reference_split}}, reference_completeness: complete, capabilities: [train_reference]}
  seeds: [17, 29, 43]
arms:
  - {id: current_binary, role: baseline, overlay: {supervision: {mode: auto, auto_policy: {kind: current}}}}
  - {id: all_label_free, role: control, overlay: {supervision: {mode: label_free}}, deployable: false, supervision_label: target_label_free}
  - {id: all_supervised, role: control, overlay: {supervision: {mode: supervised}}, deployable: false, supervision_label: in_pair_supervised}
  - {id: threshold_auto, role: candidate, overlay: {supervision: {mode: auto, auto_policy: {kind: threshold}, min_effective_training_units: {accept: {unit: source_groups, minimum: 100}, calibration: {unit: source_groups, minimum: 100}, rerank: {unit: source_groups, minimum: 1000}}}}}
  - {id: profile_rule_auto, role: candidate, overlay: {supervision: {mode: auto, auto_policy: {kind: profile_rule}}}}
selection:
  decisions:
    - id: automatic_mode_rule
      baseline: current_binary
      candidates: [threshold_auto, profile_rule_auto]
      metric: labelled_effective_units
      direction: min
      min_delta: 0.0
      min_relative_delta: 0.25
      evidence: paired_ci_lower
      strict: true
      guards:
        - {id: macro_f1_noninferiority, metric: F1, direction: max, min_delta: -0.005, evidence: paired_ci_lower, strict: true}
      tie_breaks:
        - {kind: metric, metric: F1, direction: max}
        - {kind: arm_order, direction: min, order: [threshold_auto, profile_rule_auto]}
      required_controls: [all_label_free, all_supervised]
design:
  primary_comparison: fitted_auto_rule_vs_current_binary
  primary_endpoint: macro_F1
  independent_unit: source_entity
  power_status: underpowered
  assumptions: ["One labelled source can supervise every compatible component without duplicate annotation cost.", "Budget grid is exactly {0,25,50,100,250,500,1000,all} with three deterministic source-group subsamples per point.", "Acceptance, calibration, fusion, and ranking count unique labelled source groups; retrieval counts positive sources with a safe negative; relation typing uses minimum supported-relation count; LLM uses counterfactual or teacher sources; graph structure uses seed sources.", "Active selection sorts by descending uncertainty, descending model disagreement, then source IRI.", "The crossover is the first budget whose paired 95% CI lower bound versus full supervision exceeds -0.005 and remains so after development-only isotonic smoothing.", "Promotion requires at least 25% fewer labelled effective units than the frozen supervised control while satisfying the -0.005 macro-F1 non-inferiority margin."]
  required_slices: [component, label_budget, entity_kind, structural_profile]
  regression_bound: 0.005
  non_inferiority_margin: -0.005
  multiplicity: holm
negative_label_policy: component_specific
