schema_version: 1
experiment_id: E05
title: Zero-shot candidate retrieval upgrades
implementation: {status: deferred, reason: "Development selection still uses end-to-end F1 instead of the required retrieval-only candidate-recall and gold-rank endpoint."}
base_config: ../../../exact/default_config.yaml
baseline_id: R_n
depends_on: [E00]
resource: {kind: gpu, device: "0", concurrency: 1}
screen:
  tasks:
    - {id: bioml-ncit-doid-valid, split_role: development, track: bioml_hf, task: ncit-doid, reference_role: valid, overlay: {data: {candidate_source: generated}, evaluation: {dual_global_local: true}}, reference_completeness: complete, capabilities: [train_reference]}
    - {id: bioml-snomed-fma-valid, split_role: development, track: bioml_hf, task: snomed-fma, reference_role: valid, overlay: {data: {candidate_source: generated}, evaluation: {dual_global_local: true}}, reference_completeness: complete, capabilities: [train_reference]}
  seeds: [17]
  source_cap: 300
confirm:
  tasks:
    - {id: bioml-ncit-doid-test, split_role: reporting, track: bioml_hf, task: ncit-doid, reference_role: test, overlay: {data: {candidate_source: generated}, evaluation: {dual_global_local: true}}, reference_completeness: complete, capabilities: [train_reference]}
    - {id: bioml-snomed-fma-test, split_role: reporting, track: bioml_hf, task: snomed-fma, reference_role: test, overlay: {data: {candidate_source: generated}, evaluation: {dual_global_local: true}}, reference_completeness: complete, capabilities: [train_reference]}
    - {id: anatomy-mouse-human-test, split_role: reporting, track: anatomy, task: mouse-human, reference_role: test, overlay: {data: {candidate_source: generated}, evaluation: {dual_global_local: true}}, reference_completeness: unknown, capabilities: []}
  seeds: [17, 29, 43]
arms:
  - {id: minilm_max_k20, role: baseline, overlay: {candidates: {encoder: sentence-transformers/all-MiniLM-L6-v2, top_k: 20, fusion: {mode: max}, adaptive_k: {enabled: false}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: sapbert_max_k20, role: candidate, overlay: {candidates: {encoder: cambridgeltl/SapBERT-from-PubMedBERT-fulltext, top_k: 20, fusion: {mode: max}, adaptive_k: {enabled: false}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: minilm_rrf_k20, role: candidate, overlay: {candidates: {encoder: sentence-transformers/all-MiniLM-L6-v2, top_k: 20, fusion: {mode: rrf, rrf_constant: 60.0}, adaptive_k: {enabled: false}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: minilm_weighted_k20, role: candidate, overlay: {candidates: {encoder: sentence-transformers/all-MiniLM-L6-v2, top_k: 20, fusion: {mode: weighted, weighted_semantic: 0.5, weighted_lexical: 0.5}, adaptive_k: {enabled: false}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: minilm_gap_adaptive, role: candidate, overlay: {candidates: {encoder: sentence-transformers/all-MiniLM-L6-v2, top_k: 20, fusion: {mode: max}, adaptive_k: {enabled: true, criterion: gap, gap: 0.05, k_min: 10, k_max: 40}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: minilm_entropy_adaptive, role: candidate, overlay: {candidates: {encoder: sentence-transformers/all-MiniLM-L6-v2, top_k: 20, fusion: {mode: max}, adaptive_k: {enabled: true, criterion: entropy, entropy: 0.75, k_min: 10, k_max: 40}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: sapbert_rrf_gap_adaptive, role: candidate, overlay: {candidates: {encoder: cambridgeltl/SapBERT-from-PubMedBERT-fulltext, top_k: 20, fusion: {mode: rrf, rrf_constant: 60.0}, adaptive_k: {enabled: true, criterion: gap, gap: 0.05, k_min: 10, k_max: 40}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
selection:
  decisions:
    - {id: retrieval_configuration, baseline: minilm_max_k20, candidates: [sapbert_max_k20, minilm_rrf_k20, minilm_weighted_k20, minilm_gap_adaptive, minilm_entropy_adaptive, sapbert_rrf_gap_adaptive], metric: F1, direction: max, min_delta: 0.001, allow_screened_out: true}
design:
  primary_comparison: frozen_retrieval_vs_minilm_max_k20
  primary_endpoint: macro_F1
  independent_unit: source_entity
  power_status: underpowered
  assumptions: ["Retrieval screening is deterministic for a fixed source set and encoder artifact.", "Reporting recall never selects an arm."]
  required_slices: [task, entity_kind, domain]
  regression_bound: 0.005
  cost_bound: 1.5
  multiplicity: none
negative_label_policy: not_applicable
