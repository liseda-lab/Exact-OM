    - {id: bioml-snomed-ncit-test, split_role: reporting, track: bioml_hf, task: snomed-ncit, reference_role: test, overlay: {data: {candidate_source: reference_split}, evaluation: {dual_global_local: true}}, reference_completeness: complete, capabilities: [train_reference]}
  seeds: [17, 29, 43]
arms:
  - {id: greedy_on, role: baseline, overlay: {matching: {extraction: {mode: greedy}}, selector: {runtime_enabled: true}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: mutual_best_on, role: candidate, overlay: {matching: {extraction: {mode: mutual_best}}, selector: {runtime_enabled: true}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: assignment_on, role: candidate, overlay: {matching: {extraction: {mode: assignment, assignment_component_cap: 500}}, selector: {runtime_enabled: true}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: stable_marriage_on, role: candidate, overlay: {matching: {extraction: {mode: stable_marriage}}, selector: {runtime_enabled: true}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: greedy_off, role: control, overlay: {matching: {extraction: {mode: greedy}}, selector: {runtime_enabled: false}, supervision: {mode: label_free}}, required_control: true, supervision_label: target_label_free}
  - {id: mutual_best_off, role: diagnostic, stages: [screen], overlay: {matching: {extraction: {mode: mutual_best}}, selector: {runtime_enabled: false}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: assignment_off, role: diagnostic, stages: [screen], overlay: {matching: {extraction: {mode: assignment, assignment_component_cap: 500}}, selector: {runtime_enabled: false}, supervision: {mode: label_free}}, supervision_label: target_label_free}
