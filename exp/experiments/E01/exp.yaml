design:
  primary_comparison: frozen_extractor_vs_greedy
  primary_endpoint: macro_F1
  independent_unit: source_entity
  power_status: underpowered
  assumptions: ["Exact matches are preassigned.", "Assignment falls back to mutual-best above the frozen component cap."]
  required_slices: [task, entity_kind, target_collision]
  regression_bound: 0.005
  cost_bound: 1.2
  multiplicity: none
  reporting_exclusions: [reference_incomplete_cardinality_mode_selection]
negative_label_policy: not_applicable
