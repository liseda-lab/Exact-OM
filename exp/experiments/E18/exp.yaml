      candidates: [channel_gating]
      metric: F1
      min_delta: 0.001
      guards:
        - {id: local_mrr_noninferiority, metric: local.MRR, direction: max, scope: each_task, min_delta: -0.005}
        - {id: exact_explanation_reconstruction, metric: explanation_reconstruction.max_abs_error, comparison: absolute_threshold, direction: min, scope: each_cell, threshold: 0.000001}
      required_controls: [analytic]
design:
  primary_comparison: frozen_decomposition_preserving_reranker_vs_current_listwise
