    - {id: graph_channel, baseline: evidence_baseline, candidates: [graph_inductive, graph_transductive], metric: F1, min_delta: 0.001, required_controls: [anchor_label_free, relations_shuffled]}
design:
  primary_comparison: frozen_graph_channel_vs_evidence_baseline
  primary_endpoint: tbox_poor_macro_F1
  independent_unit: source_entity
  power_status: underpowered
  assumptions: ["Seed mappings never enter the reporting reference or candidate construction."]
  required_slices: [tbox_depth, degree_quartile, non_exact_label]
  regression_bound: 0.005
  cost_bound: 1.2
  multiplicity: holm
