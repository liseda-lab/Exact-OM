base_config: ../../../exact/default_config.yaml
baseline_id: R_n
depends_on: [E02, E12, E13, E18, E19]
resource: {kind: gpu, device: "0", concurrency: 1}
screen:
  tasks:
    - {id: oaei-kg-starwars-swg-diagnostic, split_role: diagnostic, track: oaei_kg, task: starwars-swg, reference_role: valid, overlay: {data: {candidate_source: generated}}, reference_completeness: unknown, capabilities: [instance_reference, graph_structure]}
  seeds: [17]
  source_cap: 300
confirm:
  tasks:
    - {id: oaei-kg-starwars-swg-test, split_role: reporting, track: oaei_kg, task: starwars-swg, reference_role: test, overlay: {data: {candidate_source: generated}}, reference_completeness: unknown, capabilities: [instance_reference, graph_structure]}
  seeds: [17, 29, 43]
arms:
  - {id: evidence_baseline, role: baseline, overlay: {matching: {channels: {graph: {mode: off}}}, supervision: {components: {structure: label_free}}}, supervision_label: target_label_free}
  - {id: anchor_label_free, role: control, overlay: {matching: {anchor_rescoring: {mode: one_pass}}, supervision: {components: {structure: label_free}}}, required_control: true, supervision_label: target_label_free}
  - {id: graph_inductive, role: candidate, overlay: {matching: {channels: {graph: {mode: inductive}}}, supervision: {components: {structure: supervised}}}, supervision_label: in_pair_supervised}
  - {id: graph_transductive, role: candidate, overlay: {matching: {channels: {graph: {mode: transductive}}}, supervision: {components: {structure: supervised}}}, supervision_label: in_pair_supervised}
  - {id: graph_only, role: diagnostic, overlay: {matching: {channels: {graph: {mode: graph_only}}}, supervision: {components: {structure: supervised}}}, deployable: false, supervision_label: in_pair_supervised}
  - {id: relations_shuffled, role: control, overlay: {matching: {channels: {instance: {enabled: true, relations_shuffled: true}, graph: {mode: inductive}}}}, required_control: true, supervision_label: in_pair_supervised}
selection:
