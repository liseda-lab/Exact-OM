schema_version: 1
experiment_id: E25
title: LLM gate viability and bounded routing
implementation: {status: deferred, reason: "Per-pair gate diagnostics and strict gate modes exist, but global quantile-threshold fitting, frozen forced-sample artifacts, a canonical hard LLM-off switch, and router training are not complete."}
base_config: ../../../exact/default_config.yaml
baseline_id: R_n
depends_on: [E00]
resource: {kind: llm, profile: openrouter_gpt4o_mini, concurrency: 1}
screen:
  tasks:
    - {id: bioml-ncit-doid-valid, split_role: development, track: bioml_hf, task: ncit-doid, reference_role: valid, overlay: {data: {candidate_source: reference_split}}, reference_completeness: complete, capabilities: [train_reference, llm_logprobs]}
  seeds: [17]
  source_cap: 300
confirm:
  tasks:
    - {id: bioml-ncit-doid-test, split_role: reporting, track: bioml_hf, task: ncit-doid, reference_role: test, overlay: {data: {candidate_source: reference_split}}, reference_completeness: complete, capabilities: [train_reference, llm_logprobs]}
    - {id: anatomy-mouse-human-test, split_role: reporting, track: anatomy, task: mouse-human, reference_role: test, overlay: {data: {candidate_source: generated}}, reference_completeness: unknown, capabilities: [llm_logprobs]}
  seeds: [17, 29, 43]
arms:
  - {id: analytic, role: baseline, overlay: {llm: {experiment: {enabled: true, gate: {mode: analytic, threshold: 0.5}}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: llm_off, role: control, overlay: {llm: {experiment: {enabled: true, gate: {mode: analytic, threshold: 1.0}}}, supervision: {mode: label_free}}, required_control: true, supervision_label: target_label_free}
  - {id: quantile_001, role: candidate, overlay: {llm: {experiment: {enabled: true, gate: {mode: quantile, quantile_fraction: 0.01, threshold: 0.95}}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: quantile_005, role: candidate, overlay: {llm: {experiment: {enabled: true, gate: {mode: quantile, quantile_fraction: 0.05, threshold: 0.85}}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: quantile_010, role: candidate, overlay: {llm: {experiment: {enabled: true, gate: {mode: quantile, quantile_fraction: 0.10, threshold: 0.75}}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: forced_sample, role: diagnostic, stages: [screen], overlay: {llm: {experiment: {enabled: true, gate: {mode: forced_sample, forced_sample_size: 100}}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: oracle_route, role: oracle, stages: [screen], overlay: {llm: {experiment: {enabled: true, gate: {mode: oracle}}}}, deployable: false, supervision_label: oracle_diagnostic}
  - {id: router, role: diagnostic, stages: [screen], overlay: {llm: {experiment: {enabled: true, gate: {mode: router}}}, supervision: {components: {llm: supervised}}}, deployable: false, supervision_label: in_pair_supervised}
selection:
  decisions:
    - {id: llm_gate, baseline: analytic, candidates: [quantile_001, quantile_005, quantile_010], metric: F1, min_delta: 0.001, required_controls: [llm_off]}
design:
  primary_comparison: frozen_quantile_gate_vs_analytic
  primary_endpoint: macro_F1_and_macro_MRR
  independent_unit: source_entity
  power_status: underpowered
  assumptions: ["Quantile cutoffs and forced samples are frozen on development data."]
  required_slices: [same_family_confounder, gate_outcome, task]
  regression_bound: 0.005
  cost_bound: 1.0
  multiplicity: none
negative_label_policy: oracle_is_diagnostic_only
