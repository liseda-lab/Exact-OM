schema_version: 1
experiment_id: E25
title: LLM gate viability and bounded routing
implementation: {status: deferred, reason_code: gate_artifacts_and_confirmation_inputs_unavailable, reason: "Analytic, quantile, forced-sample, and zero-call oracle scorer paths are implemented, but task-and-kind-fitted immutable selection artifacts, a confirmation-grade resolved LLM identity/cache, and the required reporting matrix are not materialized; the learned gate belongs to E21."}
base_config: ../../../exact/default_config.yaml
baseline_id: R_0
depends_on: [E00]
resource: {kind: llm, profile: openrouter_gpt4o_mini, concurrency: 1}
screen:
  tasks:
    - {id: bioml-ncit-doid-valid, split_role: development, track: bioml_hf, task: ncit-doid, reference_role: valid, overlay: {data: {candidate_source: reference_split}}, reference_completeness: complete, capabilities: [train_reference, llm_logprobs]}
  seeds: [17]
  source_cap: 300
confirm:
  tasks:
    - {id: bioml-ncit-doid-test, split_role: reporting, track: bioml_hf, task: ncit-doid, reference_role: test, overlay: {data: {candidate_source: reference_split}}, reference_completeness: complete, capabilities: [train_reference, llm_logprobs]}
    - {id: anatomy-mouse-human-test, split_role: reporting, track: anatomy, task: mouse-human, reference_role: test, overlay: {data: {candidate_source: generated}}, reference_completeness: unknown, capabilities: [llm_logprobs], availability: {status: deferred_unavailable, reason_code: anatomy_2025_not_materialized, missing_capability: ontology_pair_reference_and_llm_logprobs, expected_dataset: OAEI-Anatomy-2025/mouse-human, reason: "Pinned Anatomy inputs and an immutable LLM backend are not materialized locally; implementation must not download or call them."}}
  seeds: [17, 29, 43]
arms:
  - {id: analytic, role: baseline, overlay: {llm: {experiment: {enabled: true, gate: {mode: analytic, threshold: 0.5}}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: llm_off, role: control, overlay: {llm: {experiment: {enabled: false}}, supervision: {mode: label_free}}, required_control: true, supervision_label: target_label_free}
  - {id: quantile_001, role: candidate, overlay: {llm: {experiment: {enabled: true, gate: {mode: quantile, quantile_fraction: 0.01}}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: quantile_005, role: candidate, overlay: {llm: {experiment: {enabled: true, gate: {mode: quantile, quantile_fraction: 0.05}}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: quantile_010, role: candidate, overlay: {llm: {experiment: {enabled: true, gate: {mode: quantile, quantile_fraction: 0.10}}}, supervision: {mode: label_free}}, supervision_label: target_label_free}
  - {id: forced_sample, role: diagnostic, stages: [screen], overlay: {llm: {experiment: {enabled: true, gate: {mode: forced_sample, forced_sample_size: 100}}}, supervision: {mode: label_free}}, deployable: false, supervision_label: target_label_free}
  - {id: oracle_route, role: oracle, stages: [screen], overlay: {llm: {experiment: {enabled: true, gate: {mode: oracle}}}}, deployable: false, supervision_label: oracle_diagnostic}
selection:
  decisions:
    - {id: llm_gate, baseline: analytic, candidates: [quantile_001, quantile_005, quantile_010], metric: F1, min_delta: 0.001, required_controls: [llm_off]}
design:
  primary_comparison: frozen_quantile_gate_vs_analytic
  primary_endpoint: macro_F1
  independent_unit: source_entity
  power_status: underpowered
  assumptions: ["Quantiles are fitted separately per development task and entity kind, sort by (-U, source_iri, target_iri), route exactly ceil(p*N), and persist count, cutoff, boundary IDs, selected pairs, and dataset signature for confirmation.", "The 100-row forced sample uses a frozen seed and deterministic SHA-256 pair ordering.", "The oracle is analytical, always correct, makes zero LLM calls, and is excluded from selection and product configuration.", "E25 implements no learned gate; E21 owns the learned comparison."]
  required_slices: [same_family_confounder, gate_outcome, task]
  regression_bound: 0.005
  multiplicity: none
negative_label_policy: oracle_is_diagnostic_only
