model:
  name: EncoderClassifier
  params:
    encoder_name: sentence-transformers/all-MiniLM-L6-v2
    pooling: mean # mean, cls, max
    use_lora: True
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05

loss:
  name: BCEWeightedLoss
  params:
    pos_weight: 1.0 # 1.0, cardinality_weight
    reduction: mean

optimizer:
  name: Adam
  params:
    lr: 0.001