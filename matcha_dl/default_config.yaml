
# System Parameters

## Verbosity level of the logs.
logging_level: INFO

## Seed for reproducibility.
seed: 42

## Cuda device to be used. If None, CPU will be used.
device: 0

# Alignment Parameters

## Used cached files to skip computations if available.
use_file_cache: False

## Use the last checkpoint to continue training
use_last_checkpoint: False

## Threshold to be used to filter predictions.
threshold: 0.7 # 0.7

## Number of top-k predictions to be considered for evaluation.
k: [1, 5, 10]

matcha_params:
  ## JAVA Heap Size
  max_heap: 64G
  ## Filter to generate candidates for global alignment.
  threshold: 0.9 # 0.7, 0.8, 0.9
  ## Matchers ro be used to calculate the similarity between the candidates.
  matchers: [LM, BKM, SM, WM, LLM]
  # Cardinality of negatives in the training set
  negcardinality: 10 # 9, 99
  # Filter to generate negatives in the training set
  negthreshold: 0.1 #0.4, 0.5, 0.6
  # Samplers to be used to generate negatives in the training set
  samplers: 'all' # all, rand, diff

## Whether to plot the distribution of the similarities in the negative set.
plot_negatives:
  enabled: True
  figsize: [8, 5]
  kde: True
  bins: 20
  color: blue
  alpha: 0.6
  dpi: 300
  grid: True

training_params:
  epochs: 10 # 50
  batch_size: 1 # 1, 32
  val_every: 1
  save_interval: 5
  
stopper:
  name: EarlyStopping
  params:
    tolerance: 5
    min_delta: 0.0

model:
  name: MlpClassifier
  params:
    layers: [128, 256, 128]

loss:
  name: BCEWeightedLoss
  params:
    pos_weight: 1.0 # 1.0, cardinality_weight
    reduction: mean

optimizer:
  name: Adam
  params:
    lr: 0.001