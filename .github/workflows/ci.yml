name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.1.4
          virtualenvs-in-project: true
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install --with prebuild --extras "viz reasoning"
      - run: poetry run black --check exact exact_inspect tests tools study_visualizer_runtime
      - run: poetry run isort --check-only exact exact_inspect tests tools study_visualizer_runtime
      - run: poetry run flake8 exact exact_inspect tests tools study_visualizer_runtime
      - run: poetry run mypy
      - run: poetry run lint-imports
      - name: Check priority public API docstrings
        run: >-
          poetry run interrogate
          exact/delivery/api
          exact/ontology
          exact/io
          exact/core/contracts
          exact/utils/timing.py
          exact/utils/candidate_generation.py
          exact/utils/graph_search.py
      - name: Enforce Java-free runtime
        shell: bash
        run: |
          if git grep -n -iE '(^|[[:space:]])(from|import)[[:space:]]+(jpype|mowl|deeponto|pyhornedowl|org\.semanticweb)' -- \
            exact deploy tools \
            ':!tools/capture_backend_baseline.py'; then
            echo "Legacy ontology runtime import found" >&2
            exit 1
          fi
          if git grep -n -E 'pyowl_core\.backends|pyowl2vec_star_projector\.(compiler|native)' -- exact; then
            echo "Consumer imported a shared-stack implementation module" >&2
            exit 1
          fi
      - run: poetry run pytest -m "not requires_data and not slow and not requires_cuda and not requires_openrouter" --cov=exact

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: explanations_visualizer/package-lock.json
      - uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.1.4
          virtualenvs-in-project: true
      - run: poetry install --with prebuild --extras viz
      - run: make build-frontend
      - run: poetry build
      - name: Verify wheel dependencies, extras, frontend, and compatibility contract
        run: |
          poetry run python - <<'PY'
          import glob
          import json
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")
          sdist = glob.glob("dist/*.tar.gz")
          assert len(wheel) == 1, wheel
          assert len(sdist) == 1, sdist
          with zipfile.ZipFile(wheel[0]) as archive:
              names = archive.namelist()
              assert "exact_inspect/static/index.html" in names
              contract_name = "release/core-compatibility.json"
              assert contract_name in names
              wheel_contract = json.loads(archive.read(contract_name))
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode("utf-8")
          with tarfile.open(sdist[0], "r:gz") as archive:
              contract_member = next(
                  member
                  for member in archive.getmembers()
                  if member.name.endswith("/release/core-compatibility.json")
              )
              stream = archive.extractfile(contract_member)
              assert stream is not None
              sdist_contract = json.load(stream)
          assert wheel_contract == sdist_contract
          assert wheel_contract["schema"] == "exact-om.ontology-stack-compatibility/1"
          for dependency in ("pyowl-core", "pyowl2vec-star-projector"):
              lines = [
                  line
                  for line in metadata.splitlines()
                  if line.lower().startswith(f"requires-dist: {dependency}")
              ]
              assert lines and all("extra ==" not in line for line in lines), lines
          for dependency in ("pyelk-reasoner", "pyhermit"):
              lines = [
                  line
                  for line in metadata.splitlines()
                  if line.lower().startswith(f"requires-dist: {dependency}")
              ]
              assert lines and all('extra == "reasoning"' in line for line in lines), lines
          for dependency in ("fastapi", "uvicorn", "pydantic-settings"):
              lines = [
                  line
                  for line in metadata.splitlines()
                  if line.lower().startswith(f"requires-dist: {dependency}")
              ]
              assert lines and all('extra == "viz"' in line for line in lines), lines
          PY
      - name: Smoke-test the built wheel in a clean environment
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel="$(realpath "${wheels[0]}")"
          smoke_venv="${RUNNER_TEMP}/exact-wheel-smoke"
          smoke_cwd="${RUNNER_TEMP}/exact-wheel-cwd"
          python -m venv "${smoke_venv}"
          "${smoke_venv}/bin/python" -m pip install --upgrade pip
          "${smoke_venv}/bin/pip" install "${wheel}"
          "${smoke_venv}/bin/pip" check
          mkdir -p "${smoke_cwd}"
          (
            cd "${smoke_cwd}"
            "${smoke_venv}/bin/exact" --help
            "${smoke_venv}/bin/exact-eval" --help
            "${smoke_venv}/bin/bioml-eval" --help
            "${smoke_venv}/bin/python" - <<'PY'
          import importlib.util

          for package in ("fastapi", "pydantic_settings", "uvicorn", "pyelk", "pyhermit"):
              assert importlib.util.find_spec(package) is None, package
          for package in ("pyowl_core", "pyowl2vec_star_projector"):
              assert importlib.util.find_spec(package) is not None, package
          PY
          )
          "${smoke_venv}/bin/python" tools/generate_sbom.py --output dist/exact-om.spdx.json
          "${smoke_venv}/bin/python" - <<'PY'
          import json

          payload = json.load(open("dist/exact-om.spdx.json", encoding="utf-8"))
          names = {item["name"].lower() for item in payload["packages"]}
          assert "pyowl-core" in names
          assert "pyowl2vec-star-projector" in names
          assert names.isdisjoint({"py-horned-owl", "pyelk-reasoner", "pyhermit"})
          PY
          "${smoke_venv}/bin/pip" install "${wheel}[viz]"
          "${smoke_venv}/bin/pip" check
          (
            cd "${smoke_cwd}"
            "${smoke_venv}/bin/exact-inspect" --help
            "${smoke_venv}/bin/exact-study-viz" --help
          )
          "${smoke_venv}/bin/pip" install "${wheel}[reasoning]"
          "${smoke_venv}/bin/pip" check
          "${smoke_venv}/bin/python" - <<'PY'
          import importlib.util
          import sys

          from exact.ontology import load_ontology

          for package in ("pyelk", "pyhermit"):
              assert importlib.util.find_spec(package) is not None, package
          ontology = b'''<?xml version="1.0"?>
          <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
                   xmlns:rdfs="http://www.w3.org/2000/01/rdf-schema#"
                   xmlns:owl="http://www.w3.org/2002/07/owl#">
            <owl:Ontology rdf:about="urn:exact:wheel-smoke"/>
            <owl:Class rdf:about="urn:A">
              <rdfs:subClassOf rdf:resource="urn:B"/>
            </owl:Class>
            <owl:Class rdf:about="urn:B"/>
          </rdf:RDF>'''
          for name in ("elk", "hermit"):
              source = load_ontology(ontology)
              snapshot = source.owl_snapshot()
              source.configure_reasoner(name, backend="auto")
              assert source.reasoner.ontology is snapshot
              assert source.reasoner.ancestors("urn:A") == {"urn:B"}
          assert "jpype" not in sys.modules and "mowl" not in sys.modules
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-om-distributions
          path: dist/*

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.1.4
          virtualenvs-in-project: true
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .venv
          key: benchmark-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install --with prebuild
      - run: poetry run python benchmarks/bench.py --repeat 7 --check-reference
