name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.1.4
          virtualenvs-in-project: true
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install --with prebuild --extras "viz reasoning bioml-eval"
      - run: poetry run black --check exact exact_inspect tests tools study_visualizer_runtime
      - run: poetry run isort --check-only exact exact_inspect tests tools study_visualizer_runtime
      - run: poetry run flake8 exact exact_inspect tests tools study_visualizer_runtime
      - run: poetry run mypy
      - run: poetry run lint-imports
      - name: Check priority public API docstrings
        run: >-
          poetry run interrogate
          exact/delivery/api
          exact/ontology
          exact/io
          exact/core/contracts
          exact/utils/timing.py
          exact/utils/candidate_generation.py
          exact/utils/graph_search.py
      - name: Enforce Java-free runtime
        shell: bash
        run: |
          if git grep -n -iE '(^|[[:space:]])(from|import)[[:space:]]+(jpype|mowl|deeponto|pyhornedowl|org\.semanticweb)' -- \
            exact deploy tools \
            ':!tools/capture_backend_baseline.py'; then
            echo "Legacy ontology runtime import found" >&2
            exit 1
          fi
          if git grep -n -E 'pyowl_core\.backends|pyowl2vec_star_projector\.compiler' -- exact; then
            echo "Consumer imported a shared-stack implementation module" >&2
            exit 1
          fi
          # Exact requests strict execution through the public projector API.
          if git grep -n -E 'pyowl2vec_star_projector\.native' -- exact; then
            echo "Private native projector implementation import" >&2
            exit 1
          fi
      - run: poetry run pytest -m "not requires_data and not slow and not requires_cuda and not requires_openrouter" --cov=exact

  package-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: explanations_visualizer/package-lock.json
      - uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.1.4
          virtualenvs-in-project: true
      - run: poetry install --with prebuild --extras viz
      - run: make build-frontend
      - run: poetry build
      - name: Verify distribution contents and freeze candidate identity
        run: >-
          poetry run python tools/verify_distribution_artifacts.py
          --dist-dir dist
          --write-support-files
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-om-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/artifact-sha256.json
            dist/stack-constraints.txt

  package-smoke:
    name: Package smoke (${{ matrix.python-version }}, ${{ matrix.artifact }})
    needs: package-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            artifact: wheel
            extra: viz
            native: false
            sbom: false
          - python-version: "3.10"
            artifact: sdist
            extra: reasoning
            native: false
            sbom: false
          - python-version: "3.11"
            artifact: wheel
            extra: reasoning
            native: false
            sbom: false
          - python-version: "3.11"
            artifact: sdist
            extra: viz
            native: false
            sbom: false
          - python-version: "3.12"
            artifact: wheel
            extra: viz-reasoning-bioml
            native: true
            sbom: true
          - python-version: "3.12"
            artifact: sdist
            extra: none
            native: false
            sbom: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exact-om-candidate-${{ github.sha }}
          path: dist
      - name: Verify downloaded candidate
        run: |
          python -m pip install "packaging>=24,<26"
          python tools/verify_distribution_artifacts.py --dist-dir dist
      - name: Select candidate artifact
        shell: bash
        run: |
          if [[ "${{ matrix.artifact }}" == "wheel" ]]; then
            artifacts=(dist/*.whl)
          else
            artifacts=(dist/*.tar.gz)
          fi
          test "${#artifacts[@]}" -eq 1
          echo "EXACT_ARTIFACT=$(realpath "${artifacts[0]}")" >> "$GITHUB_ENV"
          echo "EXACT_CONSTRAINTS=$(realpath dist/stack-constraints.txt)" >> "$GITHUB_ENV"
      - name: Clean-install and smoke base distribution
        shell: bash
        env:
          CARGO: /__exact_forbidden__/cargo
          RUSTC: /__exact_forbidden__/rustc
          JAVA_HOME: ""
        run: |
          smoke_venv="${RUNNER_TEMP}/exact-${{ matrix.python-version }}-${{ matrix.artifact }}"
          python -m venv "${smoke_venv}"
          "${smoke_venv}/bin/python" -m pip install --upgrade pip
          "${smoke_venv}/bin/python" -m pip install "packaging>=24,<26"
          "${smoke_venv}/bin/python" -m pip install \
            --only-binary=pyowl-core,pyowl2vec-star-projector,pyelk-reasoner,pyhermit \
            -c "${EXACT_CONSTRAINTS}" "${EXACT_ARTIFACT}"
          "${smoke_venv}/bin/python" -m pip check
          smoke_args=(base)
          if [[ "${{ matrix.sbom }}" == "true" ]]; then
            smoke_args+=(--sbom-output "${RUNNER_TEMP}/exact-om.spdx.json")
          fi
          (
            cd "${RUNNER_TEMP}"
            "${smoke_venv}/bin/python" \
              "${GITHUB_WORKSPACE}/tools/smoke_distribution.py" "${smoke_args[@]}"
          )
          if [[ "${{ matrix.native }}" == "true" ]]; then
            (
              cd "${RUNNER_TEMP}"
              "${smoke_venv}/bin/python" \
                "${GITHUB_WORKSPACE}/tools/smoke_distribution.py" native
            )
          fi
          case "${{ matrix.extra }}" in
            viz)
              extras=(viz)
              ;;
            reasoning)
              extras=(reasoning)
              ;;
            viz-reasoning-bioml)
              extras=(viz reasoning bioml-eval)
              ;;
            none)
              extras=()
              ;;
          esac
          for extra in "${extras[@]}"; do
            "${smoke_venv}/bin/python" -m pip install \
              --only-binary=pyowl-core,pyowl2vec-star-projector,pyelk-reasoner,pyhermit \
              -c "${EXACT_CONSTRAINTS}" "${EXACT_ARTIFACT}[${extra}]"
            "${smoke_venv}/bin/python" -m pip check
            (
              cd "${RUNNER_TEMP}"
              "${smoke_venv}/bin/python" \
                "${GITHUB_WORKSPACE}/tools/smoke_distribution.py" "${extra}"
            )
          done
      - name: Upload base SBOM
        if: matrix.sbom
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-om-base-sbom-${{ github.sha }}
          if-no-files-found: error
          path: ${{ runner.temp }}/exact-om.spdx.json

  benchmark-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: 2.1.4
          virtualenvs-in-project: true
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .venv
          key: benchmark-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install --with prebuild
      - name: Capture informational fixture timings
        run: >-
          poetry run python benchmarks/bench.py
          --repeat 7
          --output benchmark-results/fixture.json
      - name: Upload informational timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fixture-timings-${{ github.sha }}
          if-no-files-found: warn
          path: benchmark-results/fixture.json
