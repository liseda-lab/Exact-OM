name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: snok/install-poetry@v1
        with:
          version: 2.1.4
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install --with prebuild
      - run: poetry run black --check exact tests tools study_visualizer_runtime
      - run: poetry run isort --check-only exact tests tools study_visualizer_runtime
      - run: poetry run flake8 exact tests tools study_visualizer_runtime
      - run: poetry run mypy exact
      - run: poetry run lint-imports
      - name: Enforce Java-free runtime
        shell: bash
        run: |
          if git grep -n -iE 'jpype|mowl|org\.semanticweb|init_jvm' -- \
            exact tools tests deploy \
            ':!exact/__init__.py' \
            ':!tests/ontology_backend_test.py'; then
            echo "Java runtime reference found outside compatibility shims" >&2
            exit 1
          fi
      - run: poetry run pytest -m "not requires_data and not slow" --cov=exact

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: snok/install-poetry@v1
        with:
          version: 2.1.4
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: .venv
          key: benchmark-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
      - run: poetry install --with prebuild
      - run: poetry run python benchmarks/bench.py --repeat 7 --check-reference
