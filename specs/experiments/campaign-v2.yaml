authority:
- RUN-PLAN.md
- CHECKPOINT-RECOVERY.md
- IMPLEMENTATION-CLARIFICATIONS.md
hardware:
  nodes: 1
  gpu_model: RTX 5090
  gpus: 1
  host_ram_gb_profiles:
