  all_generative_roles: true
  local_generative_fallback: false
  primary_profile: resolve_existing_openrouter_profile
  authorization: user_broad_spending_discretion
  hard_usd_cap: null
  track_projected_and_actual_usd: true
  primary_models: 1
  maximum_extended_sensitivity_models: 1
  initial_concurrency: 4
  maximum_concurrency: 8
  reserve_final_calls_before_screen: true
  unique_verbalization_and_preparation_requests_count_towards_budget: true
profiles:
  core_14d:
    node_hours_cap: 336
    recovery_reserve_hours: 60
    final_hours_reserved: 54
    llm_request_planning_cap: 20000
    llm_token_planning_cap: 32000000
    final_arm_task_design_cap: 24
  extended_21d:
    node_hours_cap: 504
    recovery_reserve_hours: 84
    final_hours_reserved: 72
    llm_request_planning_cap: 40000
    llm_token_planning_cap: 64000000
    final_arm_task_design_cap: 36
budget_envelopes_core_hours:
  foundation: 12
  retrieval: 48
  channels: 48
  decisions: 36
  llm: 42
  extensions: 18
  sentinels: 18
  final: 54
  reserve: 60
budget_envelopes_extended_extra_hours:
  foundation: 0
  retrieval: 24
  channels: 18
  decisions: 18
  llm: 24
  extensions: 36
  sentinels: 6
  final: 18
  reserve: 24
screen:
  public_stage: screen
  initial_source_cap: 300
  expanded_source_cap: 1000
  initial_training_source_cap: 2000
  training_expansion_requires_named_comparison: true
  forced_llm_source_cap: 200
  seed: 17
  max_expanded_candidates_per_family: 2
  coverage: initial_screen_for_every_applicable_family
  case_choice: feature_capability_before_quality_outcomes
  case_lock_required: true
  no_cartesian_expansion: true
cases:
  D0:
    track: bioml_hf
    task: ncit-doid
    roles:
    - train
    - valid
  D1:
    track: bioml_hf
    task: snomed-fma
    roles:
    - train
    - valid
  D2:
