shared_controls:
- corrected_v2_baseline_with_parent_R0
- lexical_only
- lexical_plus_definition_attribute
- equal_active_channels
- current_supervised_ranker_acceptance
published_comparator:
  maximum_recipes: 1
  binding: available_pinned_project_matcher_or_verified_compatible_saved_predictions
  selection: capability_and_reproducibility_before_current_outcomes
  count_inside_final_cap: true
  competitive_claim_requires_compatible_comparison: true
confirm:
  public_stage: confirm
  default_class_panel:
  - H0
  - H1
  - H2
  feature_panels: selected_claims_require_their_matching_heldout_cases
  paired_stochastic_seeds:
  - 17
  - 29
  - 43
  reuse_identical_deterministic_artifacts: true
  primary_endpoint: task_macro_global_F1
  max_claimed_h0_components: 4
  max_h0_interactions: 2
  no_component_test_selection_before_stack_freeze: true
recovery:
  checkpoint_target_minutes: 5
  relocatable: true
  resume_from_previous_directory: true
  impact_plan_required_for_repairs: true
  invalidate: changed_stages_and_descendants
  preserve_immutable_attempts: true
  old_test_exposure_never_becomes_fresh: true
experiments:
- id: E00
  spec: E00-harness.md
  focused_case: D0
  budget_group: foundation
  initial_treatment_cap: 2
  dependencies: []
  treatments:
  - 'production: intended current global and local paths, with experimental switches off'
  - 'replay: identical numerical configuration after interruption and relocation'
  readiness: implementation_required
  already_implemented: Strict screen/confirm schemas, task/arm expansion, provenance, source-level metrics,
    same-fingerprint resume, inference/additional-model checkpoints, atomic explanation storage, and E17 composition
    helpers exist.
  remaining_implementation: Explicit task-mode routing; v2 per-stage identities and readiness; cross-directory
    import; selective repair/reuse; budget and broad-search planning; reporting access ledger; per-role OpenRouter
    cost admission; relocated and interrupted end-to-end proof.
  checkpoint_boundaries: All stages and attempt lineage.
- id: E01
  spec: E01-global-extraction.md
  focused_case: D0
  budget_group: decisions
  initial_treatment_cap: 5
  dependencies:
  - E00
  - pool_freeze
  treatments:
  - 'greedy: threshold-first current control'
  - 'mutual_best: reciprocal top candidate among eligible edges'
  - 'stable_marriage: source-proposing, canonical ties'
  - 'assignment_accepted_utility: eligible edges with utility score-threshold and zero unmatched utility'
  - 'assignment_legacy: raw-score optimization followed by threshold, diagnostic only'
  readiness: implementation_required
  already_implemented: Greedy, mutual-best, stable marriage, component assignment, protected-match checks,
    and component-cap fallback primitives exist.
  remaining_implementation: True global frozen-pool execution and threshold-aware accepted-edge assignment;
    current assignment applies threshold after optimization.
  checkpoint_boundaries: Decisions, per-component extraction, evaluation.
- id: E02
  spec: E02-anchor-rescoring.md
  focused_case: D0; D1 or K0 for structural efficacy
  budget_group: channels
  initial_treatment_cap: 6
  dependencies:
  - E00
  - pool_freeze
  treatments:
  - 'single_pass_hard: historical exact-anchor baseline'
  - 'single_pass_soft: exact lexical matches remain high-priority candidates'
  - 'second_pass_trusted: one rescore using declared trusted/training anchors'
  - 'second_pass_predicted: one rescore using a frozen development-selected anchor rule'
  - 'anchor_noise_001: 1% deterministic corruption on development only'
  - 'anchor_noise_005: 5% corruption of the same predeclared anchor population'
  readiness: implementation_required
  already_implemented: Exact-anchor and graph evidence helpers exist; the bounded second pass is not integrated
    for every declared arm.
  remaining_implementation: Soft-anchor competition, stage-level second-pass runner integration, explicit anchor
    provenance, self-confirmation exclusion, noise diagnostics, and checkpointed rescore.
  checkpoint_boundaries: Anchors, structural evidence, one rescoring pass.
- id: E03
  spec: E03-calibration-thresholds.md
  focused_case: D0; D1 development transfer
  budget_group: decisions
  initial_treatment_cap: 5
  dependencies:
  - E00
  - pool_freeze
  treatments:
  - 'none: fixed score threshold control'
  - 'platt: OOF fitted logistic calibration'
  - 'isotonic: bounded complexity OOF calibration'
  - 'distribution_threshold: one frozen Otsu rule, label-free'
  - 'fp_only: optional changed-loss diagnostic on the selected calibration recipe'
  readiness: implementation_required
  already_implemented: Platt/isotonic application and distribution-threshold primitives exist.
  remaining_implementation: Grouped OOF fitting/export, correct train-pool features, donor-to-recipient application,
    risk/coverage reporting, and replayable threshold selection.
  checkpoint_boundaries: OOF folds, calibrator fit, calibrated decisions, evaluation.
- id: E04
  spec: E04-nil-abstention.md
  focused_case: 'N0: DISO stix-d3fend or capability-selected NIL task; D0 pool-miss diagnostic'
  budget_group: decisions
  initial_treatment_cap: 5
  dependencies:
  - E00
  - pool_freeze
  - E03
  treatments:
  - 'nil_off: current acceptance control'
  - 'nil_heuristic: joint-scale label-free abstention'
  - 'nil_fitted: calibrated joint candidate/NIL head'
  - 'pool_miss: remove gold from development pools, diagnostic only'
  - 'listwise_none: conditional paired integration with the E07 winner'
  readiness: implementation_required
  already_implemented: Joint candidate/NIL probability primitives exist; full NIL writer/evaluator and fitted
    calibration remain incomplete.
  remaining_implementation: Natural-NIL task binding, grouped fit, output/evaluator integration, three-way
    absence semantics, and optional listwise-none integration.
  checkpoint_boundaries: NIL fit and source-level decisions/output.
- id: E05
  spec: E05-retrieval-upgrades.md
  focused_case: D0; D1 after survivor selection
  budget_group: retrieval
  initial_treatment_cap: 6
  dependencies:
  - E00
  treatments:
  - 'baseline: current MiniLM/lexical policy at mean k=20'
  - 'sapbert: encoder-only replacement'
  - 'rrf: retrieval-fusion-only replacement'
  - 'adaptive_k: k in [10,50] at matched mean budget'
  - 'combined: at most one progressive combination of development survivors'
  - 'query_rescue: optional grounded OpenRouter query/profile augmentation before G1'
  readiness: implementation_required
  already_implemented: Bounded encoder/fusion/adaptive-k controls, pool diagnostics, and matched-pool selection
    primitives exist.
  remaining_implementation: Bounded progressive orchestration, reusable embedding/index artifacts, per-role
    leakage checks, and an explicit G1 policy freeze; optional grounded query-rescue path.
  checkpoint_boundaries: Entity embeddings, retrieval index, per-source pools.
- id: E06
  spec: E06-string-similarity-channel.md
  focused_case: D0; P0/Conference when abbreviation or non-biomedical behavior is the question
  budget_group: channels
  initial_treatment_cap: 4
  dependencies:
  - E00
  - pool_freeze
  treatments:
  - 'current: current lexical/context pipeline'
  - 'string_added: normalized string ensemble as a distinct signal'
  - 'lexical_only: required simple baseline'
  - 'string_only: required simple diagnostic'
  readiness: implementation_required
  already_implemented: Bounded string metrics, conservative abbreviation matching, and provenance-bearing channel
    controls exist.
  remaining_implementation: V2 case selection, stage replay, full feature attribution, and effective-cost/duplication
    diagnostics.
  checkpoint_boundaries: String evidence and score replay.
- id: E07
  spec: E07-listwise-llm.md
  focused_case: D0 or a feature-selected hard/NIL case; maximum 200 forced-screen sources
  budget_group: llm
  initial_treatment_cap: 7
  dependencies:
  - E00
  - pool_freeze
  - E25_initial
  treatments:
  - 'brief_binary: current compressed-brief binary control'
  - 'brief_256_binary: same source facts and brief schema with a 256-token generation ceiling'
  - 'packet_binary: same candidates judged from the direct scored packet'
  - 'facts_binary: score-blind structured ontology evidence'
  - 'facts_listwise: same facts/candidates, one comparative call including none'
  - 'retrieved_listwise: at most two extra evidence packets then one judgment'
  - 'second_model: extended-only sensitivity of the frozen comparison'
  readiness: implementation_required
  already_implemented: Listwise prompt, categorical probability, order, and aggregation primitives exist; scorer
    grouped execution still rejects listwise modes.
  remaining_implementation: OpenRouter grouped runtime, source-level eligibility, score-blind direct packets,
    no-summary comparison, bounded evidence requests, complete response/cost ledger, and source-level integration.
  checkpoint_boundaries: Source request plans, fetched evidence, raw responses, parsing and calibrated decisions.
- id: E08
  spec: E08-attribute-polarity.md
  focused_case: D0; a case with valid identifier semantics for signed evidence
  budget_group: channels
  initial_treatment_cap: 4
  dependencies:
  - E00
  - pool_freeze
  treatments:
  - 'current: historical attribute treatment'
  - 'unified_bank: combine comparable annotation evidence'
  - 'provenance_dedup: prevent repeated facts from gaining independent mass'
  - 'signed_identifiers: only semantically justified incompatibilities'
  readiness: implementation_required
  already_implemented: Attribute-bank controls and allowlisted signed-identifier primitives exist.
  remaining_implementation: Task descriptors with real property/namespace semantics, cross-bank deduplication
    validation, and bounded conditional interaction assembly.
  checkpoint_boundaries: Annotation evidence/bank selection and dependent scores.
- id: E09
  spec: E09-hierarchy-semantics.md
  focused_case: D1 SNOMED–FMA development, with D0 control
  budget_group: channels
  initial_treatment_cap: 4
  dependencies:
  - E00
  - pool_freeze
  treatments:
  - 'current: embedded hierarchy context control'
  - 'ancestor_ic: aligned ancestor overlap with IC weighting'
  - 'sibling_context: one explicitly qualified sibling signal'
  - 'hierarchy_removed: diagnostic with other evidence fixed'
  readiness: implementation_required
  already_implemented: IC-weighted hierarchy overlap and sibling evidence primitives exist.
  remaining_implementation: Feature-appropriate case binding, controlled representation/noise checks, and complete
    hierarchy-versus-lexical contribution reporting.
  checkpoint_boundaries: Hierarchy/anchor evidence and score replay.
- id: E10
  spec: E10-fusion-selector-ablations.md
  focused_case: D0
  budget_group: channels
  initial_treatment_cap: 8
  dependencies:
  - E00
  - pool_freeze
  - E26
  treatments:
  - 'analytic_grid: six cached replays gamma={1,2,3} by tau={0.4,0.5}, decision LLM off'
  - 'winner_only: current acceptance training on the selected analytic setting'
  - 'winner_runnerup: same head/features with safe runner-up negatives'
  readiness: implementation_required
  already_implemented: Fusion controls and the existing listwise-linear/acceptance baseline exist; the earlier
    45-cell/two-phase training orchestration is incomplete.
  remaining_implementation: Cached-score constant replay, bounded two-phase selection, winner-plus-runner-up
    fitting, and immutable training artifacts.
  checkpoint_boundaries: Analytic score replay, grouped head training, acceptance.
- id: E11
  spec: E11-property-equivalence.md
  focused_case: 'P0: capability-selected Conference pair or K0 with sufficient property references'
  budget_group: extensions
  initial_treatment_cap: 4
  dependencies:
  - E00
  - kind_pool_freeze
  treatments:
  - 'property_labels: lexical property baseline'
  - 'property_annotations: add definitions/annotations'
  - 'property_signature: add domain/range, inverse and characteristic evidence'
  - 'property_usage: selected signature arm plus bounded usage context'
  readiness: implementation_required
  already_implemented: Entity-kind plumbing and typed I/O exist; property-specific evidence switches are not
    fully integrated.
  remaining_implementation: Property evidence bundles/signatures, per-kind retrieval/fitting, actual reference
    inventory, and case-scoped evaluation.
  checkpoint_boundaries: Property signatures/usage, kind-specific pools and heads.
- id: E12
  spec: E12-instance-equivalence.md
  focused_case: K0 OAEI-KG starwars-swg or a richer available BioKG instance pair
  budget_group: extensions
  initial_treatment_cap: 5
  dependencies:
  - E00
  treatments:
  - 'labels: lexical baseline'
  - 'types_literals: typed attribute evidence'
  - 'relations: bounded relation context'
  - 'relations_shuffled: structural negative control'
  - 'multi_view: one retrieval variant evaluated before its kind-pool freeze'
  readiness: implementation_required
  already_implemented: Instance-kind plumbing exists; complete evidence bundles, shuffle and anchor crosses
    are incomplete.
  remaining_implementation: Type/literal/relation bundles, kind-specific multi-view retrieval, grouped research
    partitions, deterministic degree/predicate-preserving shuffle, and instance evaluation.
  checkpoint_boundaries: Instance pool, relational features, seeded/shuffled graph and heads.
- id: E13
  spec: E13-representation-robustness.md
  focused_case: 'R0_case: same-information OWL/CSV pair, then available BioKG CSV/Datalog case'
  budget_group: extensions
  initial_treatment_cap: 4
  dependencies:
  - E00
  treatments:
  - 'owl_parity: normalized OWL evidence on the matched-information case'
  - 'csv_parity: identical facts serialized as CSV on that same case'
  - 'csv_raw: independent BioKG case before added Datalog consequences'
  - 'csv_materialized: that same BioKG case with provenance-bearing Datalog consequences'
  readiness: implementation_required
  already_implemented: OWL/RDF/CSV adapters and closure interfaces exist; paired parity/enrichment harness
    is incomplete.
  remaining_implementation: Lossless matched snapshots, feature/evidence parity comparison, explicit information-loss
    inventory, and independent materialization artifacts.
  checkpoint_boundaries: Canonical snapshots, graph closure and evidence inventories.
- id: E14
  spec: E14-typed-relations.md
  focused_case: 'T0: available BioKG-Align pair with =,<,> labels; distinct T1 final'
  budget_group: extensions
  initial_treatment_cap: 6
  dependencies:
  - E00
  - E13
  - typed_pool_freeze
  treatments:
  - 'all_equivalent: required lower control'
  - 'hierarchy_heuristic: current control'
  - 'graph_entailment: relation paths conditional on declared anchors'
  - 'learned_three_way: bounded multinomial relation head'
  - 'semantic_then_learned: selected hybrid with explicit conflict abstention'
  - 'bridge_parity: optional supported-OWL reasoner comparison'
  readiness: implementation_required
  already_implemented: Heuristic/graph relation primitives and typed writers exist; trained typer, full bridge
    integration and coherence audit are incomplete.
  remaining_implementation: Replace stale BioKG stub with the available data descriptor; grouped typed fitting,
    leave-query-bridge-out semantics, oracle-pair/full-pipeline evaluation and supported-profile reasoning
    audit.
  checkpoint_boundaries: Typed train features/heads, bridge queries, typed predictions.
- id: E15
  spec: E15-label-free-selection.md
  focused_case: D0; one D1 robustness check
  budget_group: decisions
  initial_treatment_cap: 4
  dependencies:
  - E00
  - pool_freeze
  - E03
  treatments:
  - 'analytic_fixed: no target fitting'
  - 'distribution_margin: frozen score-distribution and candidate-margin rule'
  - 'reciprocal_consensus: reciprocal top candidate plus declared support'
  - 'current_supervised: existing fitted selector, separately labeled'
  readiness: implementation_required
  already_implemented: Mode resolution and several heuristic selector controls exist; mixed-capability matrix
    handling remains incomplete.
  remaining_implementation: Strict per-component label-free execution with present train files, Otsu/margin
    and reciprocal controls in the true global path, and capability-correct comparison.
  checkpoint_boundaries: Resolved policy, source decisions and calibration artifacts where applicable.
- id: E16
  spec: E16-cross-pair-transfer.md
  focused_case: D0 donor to at most two development recipients selected by shared/disjoint ontology profile
  budget_group: decisions
  initial_treatment_cap: 3
  dependencies:
  - E00
  - pool_freeze
  - E15
  - selected_heads
  treatments:
  - 'label_free: required recipient comparator'
  - 'in_pair_supervised: recipient train fit under the frozen recipe'
  - 'donor_transfer: unchanged selected donor artifact and threshold'
  readiness: implementation_required
  already_implemented: Strict artifact-consuming paths exist; donor training/export and transfer orchestration
    are incomplete.
  remaining_implementation: Source-pair-only fit, held-out recipient application without silent refit, metadata
    for ontology/label overlap, and limited transfer reporting.
  checkpoint_boundaries: Donor fit, portable artifact validation, recipient predictions.
- id: E17
  spec: E17-promoted-stack-integration.md
  focused_case: H0/H1/H2 plus selected feature-specific held-out cases
  budget_group: final
  initial_treatment_cap: final_matrix_contract
  dependencies:
  - E00
  - G4_frozen_selection
  treatments:
  - 'baseline: frozen v2 production baseline'
  - 'stack_all: one G4-selected stack'
  - 'label_free: mandatory where the main stack uses target supervision'
  - 'stack_minus_component: at most four H0 attribution contrasts'
  - 'interaction: at most two predeclared high-risk 2x2 boundaries'
  - 'optional_profile: only if separately selected and fully budgeted'
  readiness: implementation_required
  already_implemented: Composition, leave-one-out/interaction generation and paired global-F1 reporting helpers
    exist.
  remaining_implementation: Development-only stack selection, new bounded final panel, explicit task mode across
    pool ablation, compatible refitting, fresh-role enforcement, and repair-aware result-set aggregation.
  checkpoint_boundaries: Frozen composition, predictions, evaluation and final result-set lineage.
- id: E18
  spec: E18-supervised-reranking.md
  focused_case: D0
  budget_group: decisions
  initial_treatment_cap: 5
  dependencies:
  - E00
  - pool_freeze
  - E15
  treatments:
  - 'analytic: current pair-score ranking'
  - 'current_listwise: existing linear ranker'
  - 'pairwise: same feature set, source-group RankNet objective'
  - 'channel_gating: normalized nonnegative channel weights'
  - 'additive_gam: feature-additive diagnostic on identical features'
  readiness: implementation_required
  already_implemented: Current listwise-linear training/ranking and analytic controls exist; new objective/model
    artifact trainers are incomplete.
  remaining_implementation: Grouped trainer/export for pairwise and channel-gating variants, fixed-feature
    comparisons, additive diagnostic, and acceptance interaction.
  checkpoint_boundaries: OOF folds, model/optimizer states and source ranking outputs.
- id: E19
  spec: E19-supervised-fusion.md
  focused_case: D0
  budget_group: channels
  initial_treatment_cap: 4
  dependencies:
  - E00
  - pool_freeze
  - E26
  - E10
  treatments:
  - 'analytic_shipped: nested analytic control'
  - 'analytic_fitted: same family, tau/gamma and mean-one nonnegative multipliers fitted'
  - 'learned_global: explicitly distinct normalized weighted-score family'
  - 'learned_adaptive: extended-only small nonnegative gating function'
  readiness: implementation_required
  already_implemented: Artifact-backed analytic_fitted/learned_global consumers exist; fitting and adaptive
