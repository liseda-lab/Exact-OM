- G1_pool_freeze
- G2_focused_method_search
- G3_llm_value
- G4_development_composition_freeze
- G5_single_final_study
dependency_ports:
  baseline_evidence:
    producers:
    - E00
  E05_initial:
    producers:
    - E05
    phase: initial_retrieval
  pool_freeze:
    producers:
    - E05
    - E20
    gate: G1
    null_output: frozen_baseline_policy_per_task_kind_role
  kind_pool_freeze:
    producers:
    - E00
    instance_replacement: E12_initial_retrieval
    no_dependency_on_instance_evidence_phase: true
  typed_pool_freeze:
    producers:
    - E00
    - E13
    phase: baseline_pair_pool
  selected_heads:
    producers:
    - E03
    - E15
    - E18
    - E19
    null_output: current_compatible_fitted_control
  E02_anchors:
    producers:
    - E02
    null_output: E00_anchor_free_or_current_safe
  E25_initial:
    producers:
    - E25
    phase: initial_gates_and_forced_data
    experiment_completion_required: false
  E07_judgment_evidence:
    producers:
    - E07
    fit_responses_role: train_only
    development_responses: selection_and_assessment_only
  G4_frozen_selection:
    gate: G4
    requires: all_admitted_screens_terminal
late_phases:
  E25_trust_replay:
    experiment: E25
    requires:
    - E25_initial
    - E07_judgment_evidence
    new_llm_calls: 0
