    roles:
    - development
  P0:
    selection: one_property_capable_conference_oaei_kg_or_biokg_pair
    heldout_role: P1
  K0:
    preferred_track: oaei_kg
    preferred_task: starwars-swg
    selection: verify_instance_graph_capabilities_or_bind_available_biokg_case
    heldout_role: K1
  T0:
    selection: one_available_biokg_pair_with_equivalence_and_both_subsumption_labels
    heldout_role: T1
  N0:
    preferred_track: diso
    preferred_task: stix-d3fend
    selection: verify_natural_nil_or_choose_available_eligible_case
    heldout_role: N1
  R0_case:
    selection: same_information_owl_csv_views_then_independent_datalog_enrichment
  P1:
    selection: distinct_heldout_property_case_selected_with_P0
    roles:
    - final
  T1:
    selection: distinct_heldout_typed_case_selected_with_T0
    roles:
    - final
  N1:
    selection: heldout_natural_nil_task_or_disjoint_split_selected_with_N0
    roles:
    - final
  R1_case:
    selection: heldout_representation_case_when_claimed
    roles:
    - final
  H0:
    track: bioml_hf
    task: ncit-doid
    roles:
    - test
  H1:
    track: bioml_hf
    task: snomed-fma
    roles:
    - test
  H2:
    track: bioml_hf
    task: snomed-ncit
    roles:
    - test
    claim: held_out_pair_not_unseen_ontology
  K1:
    preferred_track: oaei_kg
    preferred_task: starwars-swtor
    selection: distinct_heldout_case_compatible_with_K0
