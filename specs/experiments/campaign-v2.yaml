design_schema_version: 2
kind: exact_om_campaign_design
campaign_id: exact-om-focused-v2
design_date: '2026-09-09'
status: specification_only
executable_with_current_runner: false
requires_implementation:
- X0
- X1
- X2
- X3
- X4
- X5
