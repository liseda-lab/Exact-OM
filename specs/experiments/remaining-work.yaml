binding_groups:
  selected_heads:
    steps:
    - E19
    - E18
    - E16
    - E22
    - E22-policy
    work: Reuse compatible pre-fit evidence; E19 selects fusion, E18 selects heads, then transfer and
      label budgets retain distinct fits/folds. E22-policy follows E22. No duplicate full qualification.
  retrieval_training:
    steps:
    - E20
    work: Bind declared contrastive and cross-encoder recipes and training roles. Existing label-free
      E05 pool contract remains usable by independent families; do not require a new supervised pool for
      those comparisons.
  hosted:
    steps:
    - E25
    - E07
    - E21
    - E25-forced
    - E25-oracles
    - E25-trust
    work: Bind new decision roles and their existing request/token authorization outside historical cache-only
      queues. E25 initial precedes E07; actual forced responses precede oracle/trust replays. E21 additionally
      requires a compatible useful judge and training-only teachers.
  nil:
    steps:
    - E04
    - E04-pool-miss
    - E04-listwise-diagnostic
    work: Bind historical 2024 Bio-LLM N0 ontologies and benchmark-pool labels, distinct from natural
      NIL. E04-pool-miss removes only public N0 validation positives, with hash-bound complete labels
      for the original benchmark pool; reuse main E04 nil_off only on verified identical identities.
      The optional E04-listwise-diagnostic fixes the completed E07 facts_listwise comparator and
      is not selection eligible; completed E04 and the E07 facts_binary winner stay unchanged.
      The original selected-judge E04-listwise is inapplicable and must not be requeued. Never
      inherit D0 trained heads implicitly.
  feature:
    steps:
    - E11
    - E12-retrieval
    - E12
    - E13
    - E13-enrichment
    - E14
    - E14-bridge
    - E23
    - E23-rich-0
    - E23-rich-50
    - E23-rich-100
    work: P0/R0_case use cmt-confOf; K0 starwars-swg is positive-unlabelled; T0/R0_enrichment use the
      pinned BioKG NCIT-DOID release. E12 freezes its pool before instance evidence, E13 parity precedes
      typing/enrichment. Enrichment needs materialized native closure; optional bridge needs its separate
      OWL case. Rich graph controls use D1; no negative-requiring K0 fit.
  optional_inputs:
    steps:
    - E08-identifiers
    - E24-asymmetric
    work: Retain explicit optional dispositions until curated namespace exclusivity or typed directionality
      exists. Missing input is not a negative experimental result.
  diagnostic:
    steps:
    - E03
    work: Four primary arms are complete. Only separately declared fp_only diagnostic remains in this
      inventory; D1 robustness/expansions are additional scope.
  freeze_and_final:
    steps:
    - G4
    - E17
    - E17-published
    work: Resolve contributing comparisons and required controls; freeze complete recipes before reference-free
      final inference. Preserve complete global populations and original local-query membership, published
      comparator and actual stochastic replication. Size unique shared computation using real sustained
      throughput; historical per-pair extrapolation is not a current ETA.
